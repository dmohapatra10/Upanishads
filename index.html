var E={
"isha-1":[["What the verse says","The verse opens with īśā, “by the Lord”. Everything in this world, “whatever moves in the moving world”, is covered by the Lord. The word vāsyam carries two pictures at once: a garment wrapped around a body, and a house with someone living inside. In both, the divine is not somewhere far away. It is the very fabric and the resident of the world.|The second half gives the instruction that follows from this: tena tyaktena bhuñjīthāḥ, “enjoy through letting go”. Then comes a warning, mā gṛdhaḥ, “do not be greedy”, and a question, kasya svid dhanam, “whose wealth is it, after all?”"],["Why renounce and enjoy together?","Many people read this verse and think it asks you to give up the world. It does not. It asks you to give up the grabbing. Enjoyment is allowed, even encouraged. What is dropped is the feeling that ‘this is mine, and I must have more’.|Think of a guest at a good hotel. She enjoys the bed, the food and the view fully. But she does not panic when checkout time comes, because she never thought the room was hers. Or think of a library book. You can love it and learn from it, and you still return it on time. When you hold things as a guest or a caretaker, enjoyment becomes lighter, because fear of loss and hunger for more have no place to grow.|The reason is given in the first line itself. If the whole world is already filled by the Lord, then there is nothing left to grab that is outside the divine, and no one else’s share to steal. Greed comes from a sense of lack. This verse says: nothing is lacking."],["How to live it today","This is why the verse is placed first in the Isha, and why it is so widely quoted. Mahatma Gandhi is said to have felt that if every other scripture were lost and only this verse remained, the heart of Hinduism would still live. Whatever the exact words, the verse is a complete way of life in one line.|You can try it in small ways. Begin the day with a moment of thanks for what you already have. Before buying something, ask whether it is a need or a craving. Share some of what you earn. Do your work as service rather than as a race. When you feel envy, remember: kasya svid dhanam, whose wealth is it anyway?|Practise this and you will find the verse true in a simple way. You can enjoy more when you grab less."]],
"katha-3":[["The picture","Yama, the lord of death, teaches Nachiketa with a single image: a person riding in a chariot. The verse says: know the Self as the rider, the body as the chariot, the intellect (buddhi) as the driver, and the mind (manas) as the reins. The following verses add the horses, which are the senses, and the roads, which are the objects the senses run towards.|The image is easy to remember, which is exactly why it has lasted for thousands of years. It gives an ordinary person a map of their own inner life."],["What each part means","The rider is you, the real Self, who wants to reach a destination: peace, freedom, a meaningful life. The rider does not drive but is the one who the whole journey is for.|The chariot is the body. It carries you, and it needs care, but it is not the traveller.|The horses are the senses. They are strong and eager. Left alone they run towards whatever looks delicious, such as sights, sounds, tastes and screens.|The reins are the mind. They connect the driver to the horses. A loose or tangled mind means the driver has no real control.|The driver is the intellect, the part of you that discerns what is wise. A sharp, calm driver holds the reins steady and chooses the road.|The Upanishad then says what happens next. If the driver is untrained and the reins are loose, the horses are wild, like unruly horses of a bad driver. If the driver is wise and the reins are firm, the horses obey, and the chariot arrives."],["Why it matters, and how to use it","Most of us blame the horses: ‘I cannot resist my phone’, ‘I cannot stop eating’. The chariot image says the trouble is usually the driver and the reins. Train the intellect to know what is truly good (the shreyas of the earlier verse), and hold the mind steady through practices like focus, routine and meditation. The senses then become useful servants rather than masters.|Try this today. When a strong urge arrives, pause and name the parts: ‘That is a horse pulling. Where is my driver? What does my rider actually want?’ That small pause is the driver picking up the reins."]],
"mundaka-1":[["The picture","This is one of the most loved images in all the Upanishads. Two birds, close friends, sit on the same tree. One eats the sweet and bitter fruit. The other does not eat at all. It simply watches.|The tree is the body and the world of experience. The fruits are joys and sorrows, successes and failures. The bird who eats is the person we usually take ourselves to be: busy, hungry, and affected by whatever the fruit tastes like."],["The two birds","The first bird is the individual who acts and experiences. When the fruit is sweet he is delighted. When it is bitter he is hurt. The verse that follows in the Upanishad says that this bird, absorbed in the tree, grieves because he feels helpless and confused.|The second bird is the Self, the silent witness. He is not distant, and he is a friend and companion who sits on the very same branch. He does not take part in the tasting. He is calm, full and aware.|The lesson is that you are, in your depth, the second bird. The one who enjoys and suffers is only the surface of your being. Underneath is a watcher that is never harmed by what happens on the tree."],["Why the watcher matters","The Upanishad says that when the first bird turns and sees the other, and sees his greatness, his grief leaves him. Nothing about the tree changes. What changes is where he stands inside himself.|This is practical. When you are angry, anxious or excited, you can say, ‘I am noticing anger,’ instead of ‘I am anger.’ That small gap is the second bird.|Try this today. Sit quietly for five minutes. Do not fix any thought. Just notice thoughts and feelings arriving and leaving, the way you would watch birds in a tree. Stay with the one who notices. Over time the fruit still tastes sweet or bitter, but it stops running your life."]]};
E["isha-2"]=[["What the verse says","Verse 1 taught letting go. Verse 2 answers the obvious worry: should I then stop working? No. The verse says kurvann eveha karmāṇi, “doing your work right here”, and jijīviṣet śatam samāḥ, “wish to live a hundred years”. Life is not the enemy. Then it makes a firm claim: for a person there is no other way, and na karma lipyate nare, “work does not stick to the person”."],["How can work not stick?","Actions usually leave a mark when we do them hungry for results. We feel proud when things work, crushed when they fail, and we carry the outcome around for years. The verse says there is another way to act: do the work fully, as your share of a world that already belongs to the Lord, as in verse 1. The doer gives full effort but is not owned by the result.|Think of a good musician. She plays with total attention, and when the song ends she lets it end. Same hands, same effort, but no residue. That is the freedom the verse promises."],["Living it today","The verse guards against two mistakes. One is running away from duty to find peace. The other is working like a machine and losing peace. The Upanishad says: stay in the world, keep working, keep wanting a full life, and keep your inner freedom.|Three small habits help. Give full effort to the task in front of you. Decide beforehand that you will accept the result, good or bad. At the end of the day, let the day go. This is also the seed of the Bhagavad Gita’s teaching of acting without clinging to the fruits of action."]];
E["isha-3"]=[["What the verse says","This verse is the Upanishad’s serious warning. It speaks of asuryā lokāḥ, worlds that are “sunless”, wrapped in blind darkness (andhena tamasāvṛtāḥ). Those who go there are the ātmahano janāḥ, literally “killers of the Self”.|It sounds harsh, but the meaning is not a threat from outside. The Self cannot really be killed. The phrase describes people who deny, neglect or bury their own deepest nature, so that they live only on the surface of life."],["What is the darkness?","Darkness here means ignorance: not knowing who you are. A person lives mostly for food, status, comfort and wins, and never once asks what is behind the one who wants all this. Life then feels crowded and yet strangely empty. Many readers take the “worlds” to mean not only a state after death but also the state of mind a person lives in right now.|Notice the contrast with verse 1. There, everything is filled with the Lord. Here, the person who ignores this fullness lives as if in a room with the lights off, although the sun is outside."],["Living it today","The verse is not meant to frighten you. It is meant to wake you. Once a day, pause and ask: who am I, apart from my job, my name, my mood and my phone? Even a minute of this turns the lights on a little.|Also notice how you treat your inner life. Sleep, silence, reflection and honest self-talk are ways of caring for the Self. Neglecting them for years is a quiet way of “killing” it. Small daily attention is the remedy."]];
E["isha-4"]=[["What the verse says","Now the Upanishad describes the Self in paradoxes. It is anejat, unmoving, and yet manaso javīyaḥ, swifter than the mind. The gods, meaning the senses, cannot reach it because it has always been ahead of them. Standing still, it outruns all who run.|The last line says that in it the life-force (mātariśvā) supports all activity. Every movement in the world rests on this still base."],["How can something still be faster?","The mind can race to the moon in a moment, but it still has to go somewhere. The Self does not go anywhere, because it is already everywhere. Space does not need to travel to reach a room. A screen does not rush to meet the movie, since every scene is already on it.|That is why the senses cannot catch it. They look outward at objects, and the Self is the one looking. You cannot chase your own eyes with your own eyes."],["Living it today","The practical lesson is this: some things are found by stopping, not by running. When you are stuck chasing an answer, a peace or a feeling, try sitting still for five minutes without chasing anything.|You may notice that beneath the restless thoughts there is a steady awareness that has not moved at all. Everything else, the thinking, wanting and worrying, is movement on top of it. The verse invites you to rest in that base."]];
E["isha-5"]=[["What the verse says","Verse 5 gives four pairs of opposites about the same One: tad ejati tan naijati, “it moves and it does not move”. Tad dūre tad v antike, “it is far and it is near”. Tad antarasya sarvasya, “it is inside all this”, and tad u sarvasyāsya bāhyataḥ, “it is outside all this”."],["Reading the paradoxes","The opposites are not a trick. They point to something that does not fit our usual categories. It seems to move because everything that moves depends on it, yet it stays still. It is far for the person who is looking for it in distant places, and near for the one who turns inward.|Inside and outside work the same way. Space is inside a pot and outside it at once. The ocean is inside every wave and also all around it. The Self is within each being and also the wider reality in which the world appears."],["Living it today","When life gives you two truths that seem to fight each other, this verse says that both may be right from different angles. You can be a small person with limits and also a part of something vast. You can be busy and still at peace.|Try noticing this once today. In the middle of a busy moment, find the quiet that is both near you and behind you. The verse says it was never far."]];
E["isha-6"]=[["What the verse says","This verse is the heart of the Isha. Yas tu sarvāṇi bhūtāni, “one who sees all beings”, ātmany evānupaśyati, “in the Self alone”. And sarvabhūteṣu cātmānaṃ, “the Self in all beings”. Tato na vijugupsate, “from that, they feel no hatred or recoil”.|There are two halves here. First, every being has its place within the one reality. Second, the same reality shines in each being. Together they remove the sense that others are fundamentally separate from you."],["Why hatred disappears","Hatred and contempt grow from the feeling of “me over here, them over there”. The verse says that when you really see the same life in other people, that feeling loses its ground. It is hard to despise someone when you see yourself in them.|This is not naive. You can still say no, set boundaries and stop harm. But you do it without hating. A surgeon cuts to heal, and a parent corrects out of love. Firmness without hatred is possible."],["Living it today","The next time someone annoys or angers you, pause and silently say: the same life that is in me is in this person too. You may find that your reaction softens. You still respond, but with less poison.|Notice also who you look down on. A colleague, a rival, a stranger. Try to find one thing you share with them, such as fear, hope or tiredness. That is the first step towards the vision of this verse."]];
E["isha-7"]=[["What the verse says","Verse 7 follows from verse 6. Yasmin sarvāṇi bhūtāni ātmaivābhūd vijānataḥ: for the one who truly knows, all beings have become the Self. Then comes a question that feels like a challenge: tatra ko mohaḥ kaḥ śoka, “what delusion, what sorrow can there be there?” for the person who sees oneness (ekatvam)."],["Why sorrow loosens","Much of our grief comes from separation: losing someone, being rejected, feeling alone. The verse does not say that loss is unreal or that tears are wrong. It says that the deepest layer of sorrow rests on a mistaken idea, the idea that I am a small, cut-off being who can lose what is “mine”.|When that idea is replaced by the sense that all life is one, grief changes. It does not vanish overnight, but it stops feeling like the end of everything. What you loved was never outside the whole, and neither are you."],["Living it today","Do not use this verse to push down your feelings. Grieve honestly. But when sorrow is heavy, try also to widen your view: remember the larger life of which you and the one you miss are both parts.|The word vijānataḥ, “of one who knows”, also matters. This is not a belief to adopt, but an understanding that grows with practice. Each time you act with kindness towards another being, you are practising seeing the one life in both of you."]];
E["isha-8"]=[["What the verse says","This verse describes the Self in a string of words. It is śukram, radiant, akāyam, without a body, avraṇam, without wound, asnāviram, without sinew or tissue, śuddham, pure, and apāpaviddham, untouched by evil. It is kaviḥ manīṣī, the all-seeing wise one, paribhūḥ, above all, and svayambhūḥ, self-existent. It arranged all things rightly (yāthātathyataḥ) through endless years."],["Meaning and practice","Each word removes something. No body means it cannot age. No wound means it cannot be harmed. Untouched by evil means that what you do and suffer does not stain it. What remains is pure awareness that sees and holds everything.|This is who you are at the deepest level, not who you were told you were. When you feel damaged or ashamed, remember this verse: the part of you that witnesses everything has never been wounded. You can say it quietly, “untouched, pure, whole”, and feel the steadiness it brings."]];
E["isha-9"]=[["What the verse says","Verses 9 to 14 form one teaching about balance. Here the Upanishad says: andhaṃ tamaḥ praviśanti ye ’vidyām upāsate, “those who follow only avidyā enter blind darkness”. Tato bhūya iva te tamo ya u vidyāyāṃ ratāḥ, “and those absorbed only in vidyā enter what seems an even deeper darkness”."],["Meaning and practice","Here avidyā means worldly action and ritual, getting things done in the world. Vidyā means knowledge and contemplation. Someone who only works, earns and builds loses the inner meaning. But someone who only studies and meditates, and avoids real life, can become proud, dry and cut off. The second darkness is called deeper because it looks like wisdom while being a trap.|The lesson is balance. If you are very busy, make time for silence. If you spend all your time in ideas or spiritual talk, go and do something useful for someone."]];
E["isha-10"]=[["What the verse says","Anyad evāhur vidyayānyad āhur avidyayā: “one result, they say, comes from knowledge, and another from action”. Then the speaker adds: iti śuśruma dhīrāṇāṃ ye nas tad vicacakṣire, “so we have heard from the wise who explained this to us”."],["Meaning and practice","The verse does two things. First, it says that action and knowledge give different fruits. Action improves life in the world: health, security and order. Knowledge gives inner freedom and peace. Neither can replace the other.|Second, the verse names its source. The teaching came down from wise teachers, not from guesswork. This is an old principle: spiritual truths are best learned from those who have lived them. Find a good teacher, book or community, and learn with humility. Test what you hear, but also be willing to listen."]];
E["isha-11"]=[["What the verse says","Here the balance is completed. Vidyāṃ cāvidyāṃ ca yas tad vedobhayaṃ saha: “one who knows both together”. Avidyayā mṛtyuṃ tīrtvā, “by action crosses over death”, vidyayāmṛtam aśnute, “and by knowledge attains immortality”."],["Meaning and practice","Action takes care of the body and its needs: food, work, health and duty. That is how we cross the practical dangers of life, which is what “crossing death” means here. Knowledge then gives what action cannot: the realisation of what in you does not die.|The verse is saying you need both rungs of the ladder. Build a stable and useful life, and also cultivate understanding. Do not wait to be “ready” to start inner growth, and do not neglect daily duties while you do it. Walk on both legs."]];
E["isha-12"]=[["What the verse says","This verse mirrors verse 9 with a new pair. Andhaṃ tamaḥ praviśanti ye ’sambhūtim upāsate: “those who worship only the unmanifest (asambhūti) enter blind darkness”. Tato bhūya iva te tamo ya u sambhūtyāṃ ratāḥ: “those devoted only to the manifest world (sambhūti) enter an even deeper darkness”."],["Meaning and practice","Sambhūti is what has come into being: the visible, changing world. Asambhūti is the unmanifest source. A person who only loves the visible world becomes lost in things and forgets the source. A person who only reveres the formless source may neglect the real world and its people.|The Isha again asks for both. See the Lord as the formless source and also in every form. Pray, but also serve. Meditate, but also take care of nature, family and community. The divine is not either one or the other."]];
E["isha-13"]=[["What the verse says","Verse 13 repeats the pattern of verse 10 for the manifest and the unmanifest. Anyad evāhuḥ sambhavād anyad āhur asambhavāt: “one result, they say, comes from the manifest, another from the unmanifest”. And again: iti śuśruma dhīrāṇāṃ, “so we have heard from the wise”."],["Meaning and practice","Each approach gives its own fruit. Honouring the manifest world, through work, care and responsibility, brings strength, prosperity and good relationships. Turning to the unmanifest source brings depth, humility and peace.|The repeated phrase “we have heard from the wise” tells us how knowledge is passed on. Insight such as this comes through a living line of teachers, not from isolated thinking. Treat the teachings as gifts from people who walked the path before you, and let them guide your own experience."]];
E["isha-14"]=[["What the verse says","Sambhūtiṃ ca vināśaṃ ca yas tad vedobhayaṃ saha: “one who knows the manifest and the perishable together”. Vināśena mṛtyuṃ tīrtvā, “by the perishable crosses over death”, sambhūtyāmṛtam aśnute, “and through the manifest attains immortality”."],["Meaning and practice","The verse uses the word vināśa, the perishable, in place of asambhūti. Commentators read it as the understanding that everything in the world passes. Knowing this, a person stops clinging, and the fear of death weakens. That is crossing death through the perishable. The same person also honours the manifest, seeing the Lord shining through the world and living with respect for all that exists, which opens the way to immortality.|Try holding both thoughts together: everything passes, and everything is sacred. The first makes you free from clinging, and the second makes you loving and attentive."]];
E["isha-15"]=[["What the verse says","Now the Upanishad turns into a prayer. Hiraṇmayena pātreṇa satyasyāpihitaṃ mukham: “the face of truth is covered by a golden vessel”. Tat tvaṃ pūṣann apāvṛṇu: “O Sun, uncover it”, satyadharmāya dṛṣṭaye, “so that I who hold to truth may see it”."],["Meaning and practice","The golden disc is the brilliance of the sun, and also the shine of the world: wealth, success and beauty. These are not evil, but they can dazzle us so much that we forget the truth behind them. The prayer asks that the glare be removed so that the real can be seen.|Notice what dazzles you: a title, a salary, a screen, praise. Ask what lies behind it. This verse makes a fine morning prayer. Asking to see clearly, rather than asking for more things, is a powerful way to begin the day."]];
E["isha-16"]=[["What the verse says","The prayer to the Sun continues. Pūṣann ekarṣe yama sūrya prājāpatya vyūha raśmīn samūha: “O nourishing Sun, sole seer, controller, son of Prajapati, spread out and gather in your rays”. Then the seer says: tejo yat te rūpaṃ kalyāṇatamaṃ tat te paśyāmi, “I see your most radiant form”, and finally, yo ’sāv asau puruṣaḥ so ’ham asmi, “the Being who is there, I am that”."],["Meaning and practice","When the glare is drawn back, the seer sees what is behind the sun and recognises it as his own Self. This line, so ’ham asmi, “I am That”, is the high point of the Upanishad. The one reality in the sun, in all beings and in you is the same.|In practice, this is not arrogance. It is the humility of seeing that your true nature is not your small ego. You can contemplate it quietly at sunrise: the light that lights the world also lights my awareness."]];
E["isha-17"]=[["What the verse says","This verse is a prayer for the time of death. Vāyur anilam amṛtam: “let the breath merge into the immortal air”. Athedam bhasmāntaṃ śarīram: “let this body end in ashes”. Then, oṃ krato smara kṛtaṃ smara: “Om, O mind, remember, remember what I have done”."],["Meaning and practice","The speaker accepts the body’s end calmly. The breath returns to the cosmic life-force, and the body to the earth. What he asks is that the mind remember the right things: his offerings and his good deeds, and above all Om, the sound of the Self. The repeated word “remember” carries urgency.|You do not have to wait for death to use this verse. Each evening, look back on the day and remember what you did well and what you wish to correct. Living so that your mind has good things to remember is the best preparation for the end."]];
E["isha-18"]=[["What the verse says","The Upanishad closes with a prayer to Agni, the fire. Agne naya supathā rāye asmān: “O Fire, lead us by the good path to fulfilment”. Viśvāni deva vayunāni vidvān: “you know all our deeds”. Yuyodhy asmaj juhurāṇam eno: “remove the wrong that makes us stray”. Then: bhūyiṣṭhāṃ te nama uktiṃ vidhema, “we offer you many words of praise”."],["Meaning and practice","Agni is the fire that carries offerings and also the inner fire of awareness. The prayer asks for guidance (the good path), honesty (you know all our deeds), repair (remove what makes us stray) and gratitude (our praise).|These four steps make a simple daily prayer even without a ritual: ask for the right direction, admit your mistakes, ask for strength to fix them, and say thanks. It is a graceful ending, and it brings the Isha back from high philosophy to everyday humility."]];
E["isha-19"]=[["What the chant says","This is the famous peace chant often recited before the Isha. Om pūrṇam adaḥ pūrṇam idaṃ: “That is whole, this is whole.” Pūrṇāt pūrṇam udacyate: “From the whole the whole arises.” Pūrṇasya pūrṇam ādāya pūrṇam evāvaśiṣyate: “Take the whole from the whole and the whole remains.”"],["Meaning and practice","“That” is the infinite source, and “this” is the world we see. Both are whole. The world comes from the source without reducing it, as a candle can light a thousand others and lose nothing.|The chant is also a lesson for how to live. You are whole, even if parts of life feel missing. Giving, sharing and teaching do not make you poorer. Recite it slowly before study or at the end of the day, and let the idea of wholeness settle."]];
E["mandukya-1"]=[["Explanation","The Upanishad begins by saying Om is all. The word akṣara means both “syllable” and “imperishable”, so Om is both the sound and the unchanging reality. Past, present and future are only its unfolding, and whatever is beyond time is also Om.|The sound is a doorway. Say it slowly and notice that it starts as an open sound and ends in silence. The rest of the Upanishad uses this to map your own mind."]];
E["mandukya-2"]=[["Explanation","A single line holds the main claim: all this is Brahman, and this Self (ātmā) is Brahman. The Self within you is not smaller than the universal reality. The word catuṣpāt, “four-footed”, introduces the plan of the Upanishad: the Self is explored through four quarters.|Think of a river in four stretches. It is the same river throughout, but you meet it in different places. In the same way, one Self appears as waking, dream, deep sleep and what lies beyond them."]];
E["mandukya-3"]=[["Explanation","The first quarter is the waking state, called Vaishvanara (the one common to all people). Here awareness looks outward at the world. “Seven limbs” and “nineteen mouths” are the parts of a cosmic being: the five senses of knowledge, five of action, five life-breaths, and mind, intellect, ego and memory make nineteen. They are the “mouths” through which we take in experience. Waking life enjoys gross things: food, sights and sounds.|Try this: notice that when you are awake, you take the outer world to be the only real one."]];
E["mandukya-4"]=[["Explanation","The second quarter is dreaming, called Taijasa (the shining one). The same instruments of experience are active, but now they face inward. In a dream you see places, people and events, and they feel completely real while it lasts, though the body lies still.|This tells you something important. The mind can create entire worlds. If that is true in a dream, then perhaps what you call “real” in waking life also depends on awareness more than you think."]];
E["mandukya-5"]=[["Explanation","The third quarter is deep sleep, named Prajna. There are no desires and no dreams. Experience is “gathered into one”, and what remains is a simple, restful bliss. Everyone knows this: you wake up and say, “I slept well, and I knew nothing.”|Notice that someone must have been present to report that rest. In deep sleep the world and the ego disappear, yet you do not. That hint points to the Self that outlasts all three states."]];
E["mandukya-6"]=[["Explanation","This verse praises the Prajna state, and through it, the Lord who is its source. This is sarveśvara, the ruler of all, sarvajña, the knower of all, and antaryāmī, the inner controller. It is also the yoni, the womb, from which all beings arise and into which they dissolve.|The meaning is that the quiet ground of deep sleep is the same ground from which the whole world emerges each morning. Seeing this changes how you view sleep and rest."]];
E["mandukya-7"]=[["Explanation","This is the most famous verse. After three states, it describes the Fourth, called Turiya, by saying what it is not: not inward, not outward, not both, not a mass of awareness, not aware of objects, not unaware. It cannot be seen, handled or defined. Positively, it is the essence of the one Self, the end of all appearance, peaceful, auspicious and without a second.|Turiya is not another state added to the three. It is the awareness in which they come and go, always present and never changing. The verse says it is to be known, not imagined."],["Try this","Notice what remains the same when your mood changes, when you go from waking to dreaming to sleep. Stay with that sense of simple presence for a few moments, without trying to name it."]];
E["mandukya-8"]=[["Explanation","Now the Upanishad links the Self to sound. The same Self, described by the word Om, has three sounds: A, U and M. The word adhimātra means that Om as a whole is more than its three parts, because after the sounds comes silence.|The four parts of the Self and the parts of Om match one by one. Chanting Om therefore becomes a way of walking through your own mind: outward, inward, into rest, and then into silence."]];
E["mandukya-9"]=[["Explanation","The sound A is the first letter and it appears in all other sounds, because every spoken sound begins by opening the mouth. In the same way, waking life is first and wide. Everything else is understood in relation to it.|The verse also gives a result: the one who knows this gains their desires and becomes first. Most teachers read this as a way to say that someone who understands the waking world as one part of a larger whole is fulfilled in it, rather than gripped by it."]];
E["mandukya-10"]=[["Explanation","The sound U stands in the middle. It lies between A and M just as dreaming lies between waking and deep sleep. It shares something of both: dreams are like waking life in content and like sleep in being inward.|The verse says one who knows this increases in wisdom and is regarded as an equal by everyone. A person who sees the links between different parts of life does not become biased or divided, and so wins the trust of others."]];
E["mandukya-11"]=[["Explanation","The sound M is the closing sound, when the lips come together. It stands for deep sleep, where everything is drawn back, like a measuring cup being emptied. The verse uses the word miti, “measuring”, and apīti, “merging”: sleep is where the world is measured out at dawn and merged back at night.|One who understands this sees the world as something that rises and sets within a greater peace, and becomes one with that source."]];
E["mandukya-12"]=[["Explanation","The final verse brings the whole Upanishad together. The Fourth has no part: it is not a sound, it is the silence after Om. It is beyond dealings, the end of all appearance, auspicious and non-dual. In this sense, Om is the Self itself.|The last line says that the knower enters the Self by the Self. Nothing outside is needed. The same awareness that has been watching all along recognises itself. The phrase is repeated twice to mark the end of the teaching."],["Try this","Chant Om three times slowly. After the last one, stay silent for a minute and notice the quiet. That silence is the closest ordinary experience to the Fourth."]];
E["kena-1"]=[["Explanation","The Upanishad opens with a student’s questions, all beginning with kena, “by whom?”. By whom is the mind sent to its work? Who first drives the breath? Who makes us speak? Who joins the eye and ear to what they do? These are not idle questions. Every day you think, see and speak, but you never ask what makes it happen.|Notice how the student does not ask about the world outside, but about the one who makes the inner instruments work. The whole Upanishad is the teacher’s answer."]];
E["kena-2"]=[["Explanation","The teacher answers in a riddle: it is the ear of the ear, the mind of the mind, the speech of speech, the breath of the breath and the eye of the eye. The ear hears sounds, but something makes hearing possible. That something is not another ear. It is the awareness behind every sense.|The verse ends with a promise. The wise, having seen this and risen above the identification with the senses, become free (amṛta) after leaving this world. In simple terms, you are not the instruments. You are the one who uses them."]];
E["kena-3"]=[["Explanation","The eye, speech and mind do not reach the Self. The eye sees objects, speech describes things, and the mind thinks about them, but the Self is not an object. That is why the teacher says: we do not know it, and we do not see how to teach it.|Then comes a surprising line: it is different from the known, and above the unknown. It is not just something we have not discovered yet. It is the knower of both. The verse also tells us that this teaching has come down from the ancient teachers, from teacher to student."]];
E["kena-4"]=[["Explanation","This verse begins a refrain that repeats four more times. Speech cannot express the Self, but speech itself exists by the Self. You cannot use words to catch the one who gives you the power of words. Like a lamp that lights up a room but cannot be lit by another lamp, it is self-evident.|The closing line is a strong correction: know that alone as Brahman, not this which people worship here. Whatever you can point at, name or place in front of you, however sacred it seems, is not the final. The ultimate is the source of all worship, not just one of its objects."]];
E["kena-5"]=[["Explanation","The same pattern applies to the mind. The mind cannot think of the Self, because the Self is the one by whom the mind is known and thought. We study the world with the mind, but we cannot step outside the mind to study it.|This does not mean the Self is a blank. It means it is closer than thought. Notice how every thought appears and disappears in awareness, which stays. The Self is that awareness, and no thought can capture it."]];
E["kena-6"]=[["Explanation","Now the eye. You can see a tree, a face, a cloud, but you cannot see the seer. Your eyes cannot look at themselves without a mirror, and no mirror can show you the one who is looking. The Upanishad says that what makes sight possible is not itself a sight.|Try noticing this once today. When you look at something, ask: who is looking? Do not answer in words. Rest in the simple fact of being the one who sees."]];
E["kena-7"]=[["Explanation","The ear is next. You hear voices, music and silence, but the ear cannot hear the hearer. The one who knows that there was a sound is not itself a sound. This is the same teaching in a new form.|By going through the senses one by one, the Upanishad leads us step by step from the outer world towards the inner witness. It also avoids a trap: it never says the senses are bad. They are good tools. They simply are not the final answer to who you are."]];
E["kena-8"]=[["Explanation","The last of the five is the breath, the life-force. Breath keeps the body alive, but even breath is not self-moving. It is led, praised by the verse as that by which the breath is led. Life itself is borrowed from something deeper.|This closes the refrain. Speech, mind, eye, ear and breath all work by the Self and cannot reach it. Having said this, the teacher will next warn the student about the opposite mistake: thinking that one has fully understood."]];
E["kena-9"]=[["Explanation","The student returns after reflecting and says something wise: I do not think I know it well, yet I do not think I do not know it. The student has understood that it cannot be known as an object, but it also cannot be completely unknown, because it is the one who knows.|This is a mature kind of knowing. It holds two truths together: humility (I cannot grasp it fully) and confidence (I am not cut off from it). The student then says that whoever among us understands this saying has understood the teaching."]];
E["kena-10"]=[["Explanation","This is the most famous verse of the Kena. For whoever thinks it is beyond understanding, it is understood. Whoever thinks they have fully understood it has not. It is unknown to those who claim to know, and known to those who do not claim to know.|The point is humility. When someone says, I have it all figured out, they are talking about an idea in their head. When someone says, I cannot capture it, but I live in it, they are closer to the truth. The same applies in daily life to people we love and to our own deepest selves: the moment we think we have fully understood them, we stop seeing them."]];
E["kena-11"]=[["Explanation","Here the story begins. Brahman, the one power behind everything, wins a battle for the gods. The gods then make a very human mistake: they take the credit. This is ours, they say, and this glory is ours.|The Upanishad is quietly pointing at all of us. When we succeed, we also say, I did it. We forget the health, talents, teachers, luck and deeper power that made it possible. The story is a mirror held up to our pride."]];
E["kena-12"]=[["Explanation","Brahman does not scold. It simply appears before the gods in a form they cannot understand, a yakṣa, a wonderful being. They do not know what it is. This is the teaching in action: when pride is at its highest, the real power shows up in a form that pride cannot grasp.|The gods’ reaction is also instructive. They stand puzzled and send others to find out. That sets up the test that follows."]];
E["kena-13"]=[["Explanation","Agni, the god of fire, goes first. Asked who he is, he says proudly that he can burn everything on earth. The being places a single blade of grass before him: burn this. Agni uses all his power and fails.|The lesson is sharp and simple. The fire that burns the world burns only because the Self allows it. Every power we are proud of is borrowed, and one small test can show how borrowed it is. Agni returns humbled and says he could not understand the being."]];
E["kena-14"]=[["Explanation","Next is Vayu, the wind god, who boasts that he can carry away everything on earth. The being puts down the same blade of grass: take this. Vayu rushes with full strength and cannot even lift it.|Notice that the test is deliberately tiny. The being does not ask for a mountain to be moved. A blade of grass is enough to show that real power does not belong to the one who thinks he owns it. Vayu also returns without an answer."]];
E["kena-15"]=[["Explanation","Now the gods turn to Indra, their chief, hoping he will succeed where the others failed. As he approaches, the being vanishes. Indra is not tested like the others. He is left alone with the empty space and his own puzzlement.|Many readers see this as a kind of grace: when someone is ready to learn rather than to prove, the lesson comes in a different way. Indra’s humility, shown by his willingness to keep looking, is rewarded in the next verse."]];
E["kena-16"]=[["Explanation","In the same space where the being had stood, a radiant woman appears: Uma, the daughter of the Himalaya. She is often understood as divine wisdom, vidyā herself. Indra asks her what the being was.|It is a meaningful moment. Knowledge of the Self does not come from strength or status. It comes through wisdom, which appears when one has dropped pride and keeps an open mind. The teacher comes when the student is ready."]];
E["kena-17"]=[["Explanation","Uma’s answer is short: this is Brahman. You were celebrating yourselves in Brahman’s victory. Only through Brahman do you win anything. Then Indra understands. The word haiḥ in the verse stresses that this is how Indra first knew it.|The moral is clear. Fire, wind and the king of gods are all powerful, but their powers belong to Brahman. Whenever you succeed, give some credit to the source. It keeps you humble, and it also keeps you free from fear of failure, because you are not the only doer."]];
E["kena-18"]=[["Explanation","Near the end, the Upanishad says where this knowledge rests. Its foundation (pratiṣṭhā) is tapas, which is discipline and focus, dama, self-control, and karma, right action. Its parts are the Vedas and their limbs, and its home is truth (satya).|The message is practical. Knowing the Self is not only a matter of reading. It needs a steady life: honest, self-controlled and disciplined. If the story of the gods teaches humility, this verse teaches how to build the ground where wisdom can grow."]];
E["katha-8"]=E["katha-3"];
E["katha-1"]=[["Explanation","The story begins with a small act of insincerity. Vajashravasa performs a sacrifice and gives away everything he owns, but he does it for reward, and he gives only the old and useless cows. His young son Nachiketa sees this.|The name of the Upanishad’s hero already tells you something: Nachiketa is a boy who notices when outward actions and inner sincerity do not match. That sharp honesty is what sets the whole teaching in motion."]];
E["katha-2"]=[["Explanation","Nachiketa thinks: if everything is being given away, then I too belong to someone. So he asks his father, to whom will you give me? He asks three times. The father, irritated, snaps: I give you to Death.|Nachiketa takes the words seriously and goes to Yama’s house. The father spoke in anger, but the son honours the word. It also teaches that a promise, even a careless one, carries weight, and that a sincere child can turn a bad moment into a path to wisdom."]];
E["katha-3"]=[["Explanation","Yama returns after three days and, as an apology for keeping a guest waiting, offers three wishes. Nachiketa asks first for his father’s peace and second for the knowledge of a sacred fire. For the third, he asks the great question: when a person dies, does he still exist?|Think about how bold this is. Nachiketa could have asked for riches or power. Instead he asks the one question everyone avoids. The Upanishad treats this as the sign of a true seeker: he wants truth, not comfort."]];
E["katha-4"]=[["Explanation","Yama has tried to avoid the question by offering wealth, long life and pleasure. When Nachiketa refuses, Yama is impressed and begins to teach. He starts with a distinction: the good (śreyas) is one thing and the pleasant (preyas) is another. Both call to us, with different results.|The verse says it goes well for one who chooses the good, and that the one who chooses the pleasant loses the real aim of life. This is the first major teaching of the Katha, and it applies to nearly every decision we make."]];
E["katha-5"]=[["Explanation","The next verse adds how the wise and the shortsighted differ. Both see the good and the pleasant. The wise (dhīra) look carefully at both and choose the good. The shortsighted (manda) choose the pleasant, because it is comfortable and secures what they already have.|Try applying it today. Before a decision, ask which option feels pleasant right now and which one is good in the long run. The Upanishad does not call pleasure evil. It asks you to choose with open eyes."]];
E["katha-6"]=[["Explanation","Now Yama answers Nachiketa’s third wish. The Self is not born and does not die. It did not come from anything, and nothing came from it. It is unborn, constant, eternal and ancient. When the body is killed, it is not killed.|This is the heart of the answer about death. What dies is the body and its parts. The knower in you, the awareness behind your thoughts, does not begin and does not end. If you take this seriously, fear of death starts to loosen."]];
E["katha-7"]=[["Explanation","Yama says that the Self cannot be gained by lectures, by cleverness or by plenty of learning. It is gained by the one whom it chooses, and to that person it reveals its own form.|This is humbling. It does not say study is useless. It says that understanding the Self is more like a grace that arrives when the heart is ready than a prize you win with intelligence. A sincere, quiet, open mind is the best preparation. Many seekers have felt this: the insight comes when they stop trying so hard."]];
E["katha-9"]=[["Explanation","Yama closes this section with a call to action: arise, awake, and learn from the best teachers. Do not sleep through your life. The wise say that the path is as sharp and hard to cross as the edge of a razor.|The line is both a warning and an encouragement. It is hard, so do not take it lightly. But it is a path, so it can be walked. Swami Vivekananda made the first part of this verse famous as a call to the young. Use it as a morning reminder to wake up inwardly, as well as outwardly."]];
E["katha-10"]=[["Explanation","Why is it hard to know the Self? Yama says the Creator made the senses face outward. Our eyes, ears and mind naturally look at things outside, not at the one who is looking. So we see the world but not the seer.|Only rarely does a wise person, wanting immortality, turn the eyes inward and see the Self. The word āvṛttacakṣuḥ means “with eyes turned back”. It describes the simple practice of meditation: turning attention from objects to awareness itself."]];
E["katha-11"]=[["Explanation","Near the end, Yama gives a promise. When all the desires lodged in the heart are let go, the mortal becomes immortal, and reaches Brahman right here. The word atra, “here”, matters. The goal is not only after death. It can be realised in this life.|Desires here are not ordinary wishes for food or rest. They mean the clinging wants that say, I will be complete when I get this. As they loosen, you find that you were already whole. This is the Katha’s final promise to Nachiketa, and to every reader."]];
E["mundaka-2"]=[["The picture","This verse gives a clear image of meditation as archery. Praṇava, the sacred syllable Om, is the bow. The Self (ātmā) is the arrow. Brahman is the target (lakṣya). The instruction that follows is apramattena veddhavyam, “it must be hit by one who is not careless”, and śaravat tanmayo bhavet, “like an arrow, one should become one with the target”."],["How the parts work together","An archer needs three things: a strong bow, a well-made arrow and a clear target. Om is the bow because chanting or silently repeating it gives the mind tension and direction, as a drawn bow gives force to an arrow. The arrow is your own awareness, which you draw back from distractions. The target is the highest Reality, the thing worth reaching.|The word apramatta, “not careless”, is the key. A good archer does not look around while aiming. In meditation, too, the mind needs steady, relaxed attention. When the arrow strikes, it does not stay beside the target. It enters it. That is the meaning of tanmaya: you become one with what you aimed at."],["Try this","Sit quietly and repeat Om slowly for a few minutes. Each time the mind wanders, gently bring it back without scolding yourself. This is how you draw the bow. Over time the attention becomes steady, and the sense of being separate from what you contemplate grows thinner."]];
E["mundaka-3"]=[["What the verse says","Satyam eva jayate nānṛtaṃ: “truth alone wins, not falsehood”. Satyena panthā vitato devayānaḥ: “by truth the path to the divine is laid out”. These words are famous. They are carved on the national emblem of India as the motto of the country. But their original home is here, in the Mundaka Upanishad."],["Truth as a path","The second half matters as much as the first. It says that truth is not only a rule for being good, it is also the road itself. The word devayāna means the path that leads towards the divine. A person who lies to others or to themselves is walking away from that road. A person who tries to be honest in thought, word and deed is already walking on it.|Falsehood may win for a while. It may bring money, praise or ease. But the Upanishad takes the long view: in the end only what is true can last. Lies need constant effort to maintain, and they break. Truth stands by itself."],["Living it today","Start with the smallest area, honesty with yourself. Notice where you tell yourself a comfortable story. Then move to speech: say what you mean without harshness. Over time, you will find that a truthful life has less fear in it, because there is nothing to hide or keep track of."]];
E["mundaka-4"]=[["The picture","Yathā nadyaḥ syandamānāḥ samudre ’staṃ gacchanti nāmarūpe vihāya: “As flowing rivers reach the sea and give up their names and forms”. Tathā vidvān nāmarūpād vimuktaḥ: “so the knower, freed from name and form, reaches the highest divine Being”."],["What is given up?","A river has a name, such as the Ganga, and a form, with banks, a path and a current. When it reaches the ocean, it does not die. It stops being a separate river and becomes the sea. Nothing is lost, and everything is gained.|In the same way, each of us has a name and form. These are the labels: my name, my body, my role, my history. The Upanishad says that a knower becomes free of them. This does not mean forgetting your name or abandoning your duties. It means you no longer think that these labels are all you are. You feel yourself as part of the whole, as a wave knows it is the ocean."],["Why it is comforting","Many people fear that spiritual freedom means losing oneself. The image of the river says the opposite. The river is not destroyed. It reaches what it was always flowing towards. This makes the verse a source of calm for those who fear change or ending."]];
E["prashna-1"]=[["What the verse says","This is a verse from the sixth and last question. Yathemā nadyaḥ syandamānāḥ samudrāyaṇāḥ: “Just as these flowing rivers, heading towards the sea”. Samudraṃ prāpyāstaṃ gacchanti: “when they reach the sea, they disappear”. Bhidyete tāsāṃ nāmarūpe: “Their names and forms are broken up”. Samudra ity evaṃ procyate: “and they are simply called the sea”."],["The sixteen parts","Sage Pippalada has just taught about the person of sixteen parts, meaning the breath, the senses, the elements and the mind, the whole equipment of a living being. He says that these parts arise from the Self and dissolve back into it, as rivers dissolve into the sea.|The image appears in the Mundaka too, but here it points to a different thing. There it describes the knower’s freedom. Here it describes how the parts of a person return to their source. Both say the same truth: the river does not keep its separate identity once it has arrived."],["Living it today","Think about a time when you felt lost in something, like music, work or a conversation, and your sense of being a separate person faded. That is a small taste of what the verse says. Seeking more of such moments, through meditation and service, is a way to move gently towards the sea."]];
E["prashna-2"]=[["What the chant says","Bhadraṃ karṇebhiḥ śṛṇuyāma devāḥ: “O gods, may we hear what is good with our ears”. Bhadraṃ paśyemākṣabhir yajatrāḥ: “O worthy ones, may we see what is good with our eyes”. The full chant continues with a prayer for strong limbs and a life that serves the divine."],["Why begin with this prayer","The Prashna Upanishad is a set of questions asked by students. Before they begin, they pray that the senses will take in only what is helpful. It is a lesson in itself: what you hear and see shapes your mind. A student who fills the ears with noise and the eyes with distraction will find it hard to understand deep teachings.|The prayer also trains attitude. You ask to hear what is good, not only what is pleasant. That mirrors the choice between the good and the pleasant that the Katha teaches."],["Living it today","Use the chant as a daily filter. Before opening your phone or turning on the news, say it once and ask: what do I want to let into my ears and eyes today? A small choice repeated every day changes the quality of a whole life."]];
E["mundaka-5"]=[["Explanation","This is where the Mundaka begins its main teaching. Shaunaka, a respected householder, does not just ask a question. He approaches Angiras vidhivat, “in the proper way”, with respect and humility. Then he asks: what is that by knowing which all this becomes known?|It is a big question, and it sets the tone for the Upanishad. Shaunaka does not want a pile of facts. He wants the one understanding that makes sense of everything else. Notice that a good question and a respectful attitude are both part of learning."]];
E["mundaka-6"]=[["Explanation","Angiras begins his answer by saying that there are two kinds of knowledge, as the knowers of Brahman have said: the lower (aparā) and the higher (parā). Lower knowledge covers the Vedas, grammar, ritual, astronomy and other fields of learning. Higher knowledge is that by which the imperishable Reality is realised.|He does not look down on lower knowledge. You need it to run life. But he says clearly that it cannot give the final fulfilment. A person can be a great scholar and still feel empty. Higher knowledge is not more information. It is direct insight into who you are."]];
E["mundaka-7"]=[["Explanation","Angiras uses a vivid image: ritual actions are like unsteady boats (plavā adṛḍāḥ). They can carry you a little way, but they are not strong enough to cross the ocean of birth and death. Those who praise them as the highest good, he says, are fools, and they fall back again into old age and death.|This is a strong statement, but its point is balance. Rituals and good deeds have value, as in the Isha, where action is praised. The warning is against treating them as the final goal. A boat is for crossing. Do not mistake the boat for the other shore."]];
E["mundaka-8"]=[["Explanation","This verse describes what happens when a seeker has had enough of outer achievements. After examining the worlds that actions can win, the person feels nirveda, dispassion. They see that the unmade, eternal Reality cannot be produced by anything made, such as work, wealth or rituals.|Then comes advice: go to a teacher. The ideal one is śrotriya, learned in the scriptures, and brahmaniṣṭha, firmly rooted in Brahman, someone who both knows and lives it. The student comes samitpāṇiḥ, with fuel in hand, a symbol of humble service. The verse teaches that wisdom is passed from one person to another, and it asks for humility from the one who learns."]];
E["mundaka-9"]=[["Explanation","The knower here sees the Lord as golden-hued: kartāraṃ, the maker, puruṣaṃ, the Being, and brahmayoni, the source of Brahma. This is the moment of direct vision. The result is a deep release: the knower shakes off (vidhūya) both merit and demerit, punyā and pāpa.|Why shake off good as well as evil? Because even good deeds, when we cling to them, keep the idea of “I am the doer” alive. The knower becomes nirañjana, stainless, and reaches paramaṃ sāmyam, the highest equality, where everything is seen as the one Self. It feels like the end of comparing and ranking."]];
E["mundaka-10"]=[["Explanation","This verse sums up the fruits of knowledge. The one who knows the supreme Brahman becomes Brahman. It does not say becomes like, but becomes. The knower crosses sorrow and sin and is freed from the knots of the heart (guhāgranthi), the tight, hidden ties of desire, fear and doubt that bind us inside.|Finally, the knower becomes immortal. In the Upanishadic sense, this means seeing that what you truly are does not die. The line about the family says that such a person lifts those around them. Real wisdom is not only a private gain. It changes the atmosphere of a household and community."]];
E["prashna-3"]=[["Explanation","Six seekers come to the sage Pippalada. He does not answer straight away. He asks them to live with him one more year with tapas, discipline, brahmacarya, restraint, and śraddhā, faith. Only then may they ask anything they like, and he promises to tell them what he knows.|The year of preparation matters. A question asked casually gets a casual answer. By living a disciplined, simple life for a year, the seekers become ready to understand. This verse also shows the sage’s honesty: yadi vijñāsyāmaḥ, “if I know”. A real teacher does not claim to know everything."]];
E["prashna-4"]=[["Explanation","After the year ends, the first to ask is Kabandhi Katyayana. His question is the most basic one: where do all these creatures come from? He asks with respect, addressing the sage as bhagavan, “venerable sir”.|It is a question each person asks at some stage of life: where does everything come from, and where do I come from? Pippalada begins his answer by describing a first creator who produced a pair, life-energy (prāṇa) and matter (rayi), and from them all beings. The Upanishad thus starts with the widest question and moves step by step inward."]];
E["prashna-5"]=[["Explanation","This verse comes from the second question, where the powers of the body argue about who is the greatest. Speech, mind, eye and ear each claim to be the one who holds up the body. Prana, the breath, simply rises to leave, and all the others are dragged along. They realise that without it they cannot stay, and they praise it.|The verse is part of their praise: everything, even what stands in the heavens, is under the control of Prana. They pray that Prana protect them as a mother protects her children, and give them fortune and wisdom. It teaches gratitude for the quiet life-force that works without being noticed."]];
E["kena-19"]=[["Explanation","After the student says he does not fully know, the teacher gives a gentle warning: if you think you have understood Brahman well, you know only a little of its form. This is true whether you look inside yourself or at the gods. So what you know still needs to be examined.|This verse protects against the opposite mistake of the earlier ones. The Self cannot be fully grasped, but that does not mean you should stop looking. Keep inquiring. A student who thinks he knows has stopped learning."]];
E["kena-20"]=[["Explanation","Here the Upanishad says how the Self is truly known: pratibodhaviditam, “known in every act of knowing”. You do not need a special moment. In each experience, whenever you see, hear or think, the Self is the awareness that makes it possible. To recognise it there is to know it.|The verse adds a promise. By the Self one gains strength, and by knowledge one gains immortality. Strength comes when you stop depending on outer supports and rest in your own awareness."]];
E["kena-21"]=[["Explanation","The second chapter ends on an urgent note: if you know it here, in this life, that is truth. If you do not, the loss is great. The best time to start is now, because every day lived without knowing is a day of lost fulfilment.|Then it describes what the wise do: they look for the Self in every being. They recognise the same Self in all, and by that they become free."]];
E["kena-22"]=[["Explanation","The Kena ends with a promise to the one who understands this teaching. That person throws off evil, meaning the mistaken sense of being a limited doer, and becomes established in the infinite. The last word is said twice to mark the end of the Upanishad.|Think back to the story. The gods took credit for Brahman’s victory and had to learn humility. The one who learns it is established in something larger than personal success or failure."]];
E["katha-12"]=[["Explanation","Yama returns home to find that Nachiketa has waited at his door for three nights without food. In India a guest is treated as a god, so this is a serious lapse on Yama’s part. To make up for it, he offers Nachiketa three wishes, one for each night.|The verse shows Yama’s character. The lord of death is not cruel. He is fair and honours dharma even when it is inconvenient for him. It also sets up the entire teaching of the Katha: a boy who waited patiently gets to ask Death the biggest question of all."]];
E["katha-13"]=[["Explanation","Yama tries to avoid answering the third question. He offers sons and grandsons, cattle, elephants, gold, a huge kingdom and a long life. Nachiketa replies calmly: a person cannot be satisfied with wealth. And he adds that even if he did get these things, they would last only as long as Yama allows.|It is a mature answer for a boy. He sees that wealth does not solve the problem of death and is not the real wish. He sticks to the one wish he made. Firmness in what matters is a mark of wisdom."]];
E["katha-14"]=[["Explanation","Yama begins to describe the Self. It is smaller than the smallest and larger than the largest. It sits in the heart of every creature. It is smaller than an atom because it is subtle and beyond all objects. It is larger than the sky because it contains everything.|The verse also says who can see its greatness: the one who is free of craving, with a clear and calm state of the senses and mind. A restless, wanting mind does not see it. A quiet one does."]];
E["katha-15"]=[["Explanation","This verse continues the chariot image. After describing the rider, the body, the driver and the reins, it adds that the senses are the horses and the objects of the senses are their paths. The Self, joined with body, senses and mind, is the experiencer.|It is a useful way to see what is happening when you want something: the horses are pulling towards the road they like. Whether you follow them or steer them is the question. The next verses say what happens when the driver lacks understanding, and what happens when he has it."]];
E["katha-16"]=[["Explanation","Why do we not see the Self if it is in all beings? Yama says it is hidden and does not shine out, like a lamp covered by a cloth. It is seen only by sharp and subtle minds, by those who look closely.|This does not mean you must be clever. It means attentive. Quiet, concentrated awareness, trained by practice, can see what a busy mind misses. Think of how you notice details in a still room that you miss in a crowd. The Self is subtle, and so it asks for a subtle, calm kind of looking."]];
E["kena-23"]=[["Explanation","The gods are puzzled by the strange being and need someone to find out what it is. They turn first to Agni, whose name Jataveda means “the one who knows all that is born”. If anyone can recognise it, surely the god of fire can.|The detail is worth noticing. The gods choose the one with the best reputation for knowing. The story is setting up a lesson: even the best-qualified knower of the outer world cannot know the source of knowing by his own power. Agni accepts with confidence: so be it."]];
E["kena-24"]=[["Explanation","Agni rushes towards the being, and the being asks a simple question: who are you? Agni answers with his titles: I am Agni, I am Jataveda. He introduces himself by his name and his reputation.|This is how most of us answer the same question. We say our name, our job and our achievements. The being does not say anything against this. It simply waits, and in the next verse asks what Agni can do. The story is gently showing how much of our identity is made of titles."]];
E["kena-25"]=[["Explanation","The being asks, what power do you have? Agni answers proudly: I can burn everything on earth. That is a great claim, and it is true in its way. Fire does consume forests, cities and metals.|Notice how the being’s question is not about knowledge or goodness, only about power. It is preparing a test. A claim becomes meaningful only when it meets something that does not fit it. Agni does not know yet that his power is borrowed, and the next verse will show it."]];
E["kena-26"]=[["Explanation","When Agni returns without an answer, the gods turn to Vayu, the wind. His reputation is also big: he moves everywhere, touches everything and carries sound and scent. If a mysterious being is hiding anywhere in the world, the wind should be able to find it.|Vayu says so be it, just as Agni did. The repetition is deliberate. The Upanishad shows that each god makes the same mistake. Each one thinks his own power is enough to understand the source of all power."]];
E["kena-27"]=[["Explanation","Vayu runs towards the being, and it asks him the same question: who are you? He gives two titles, Vayu and Matarishva, which means the one who moves in space. Like Agni, he describes himself by his role and his fame.|The story repeats the structure because repetition is how a lesson sinks in. The same pride, the same introduction, the same question. By the second time, the reader already sees what is coming and starts to smile, and that smile is the first step of understanding the lesson."]];
E["kena-28"]=[["Explanation","Asked what power he has, Vayu answers: I can carry off everything on earth. The wind can lift leaves, clouds, sand and even houses. His boast mirrors Agni’s, and so the stage is set for the same test with the same blade of grass.|Taken together, verses 3.5 and 3.9 show that fire and wind stand for the great forces of nature. The Upanishad asks us to notice that these great forces cannot do something as small as burn or lift a blade of grass when the source of their power holds it back."]];
E["kena-29"]=[["Explanation","After Indra learns the truth, the Upanishad explains why Agni, Vayu and Indra are honoured above the other gods. They came nearest to Brahman, and they were the first to understand that the strange being was Brahman.|It is a quiet turn in the story. Agni and Vayu failed the test, but they are praised. Their failure brought them close, and their honest return, saying we could not find out, opened the way to wisdom. Being humbled by the truth is a kind of success."]];
E["kena-30"]=[["Explanation","The verse singles out Indra as the one who surpasses the other gods. He was the one who came closest of all, and he was the first to know that this was Brahman. The Upanishad is clear about the reason: he stayed open when the being vanished, and Uma then taught him.|Indra’s example says something for any student. Rank in the world does not decide who learns. What matters is the willingness to go on looking after the first attempts have failed, and to receive instruction with humility."]];
E["kena-31"]=[["Explanation","Now Uma teaches how Brahman can be pointed to, using two images. About the divine world, it is like a flash of lightning, which shows everything for an instant and then is gone, and like the blink of an eye, which is quick and effortless.|These are not definitions. They are hints. Lightning lights up the whole sky without anyone seeing where it comes from. In the same way, Brahman is the sudden light behind everything that we see. It cannot be held, but it can be recognised in a flash of insight."]];
E["kena-32"]=[["Explanation","Uma gives the second teaching, about the individual self. The mind seems to move towards Brahman, as if it were going somewhere, and through the mind the seeker remembers it again and again with firm resolve.|The word seems is important. The mind does not really reach Brahman, because Brahman is not an object to be reached. But the mind can turn towards it, and keep returning with steady intention. That repeated turning is what meditation is. The mind is the doorway, and the resolve is the hand that keeps opening it."]];
E["kena-33"]=[["Explanation","Brahman is called tadvana here, which can be understood as the one all beings long for, or the beloved of all. It should be meditated on in just this way. The verse gives a result as well: one who knows it thus is loved and sought by all beings.|The idea is easy to feel. Someone who rests in the Self, and is not hungry for approval, becomes warm and steady. People are drawn to such a person without being asked, because the presence of a calm, contented being feels like home."]];
E["kena-34"]=[["Explanation","The student asks the teacher to tell him the Upanishad, the secret teaching. The teacher replies that it has already been told, and that this was the Upanishad about Brahman.|It is a gentle surprise. The student expected something extra, a hidden last part. The teacher says there is none. The whole conversation, the questions, the story of the gods and the lessons on humility and stillness, was the secret. What remains is not more information but living what has been said."]];
E["katha-17"]=[["Explanation","Yama tries to talk Nachiketa out of his third wish by offering everything a person could want: sons and grandsons who live a hundred years, herds of cattle, elephants, gold and horses, a huge estate, and a life as long as he wishes.|Yama is testing him. Is the boy asking about death out of real longing, or would a good offer distract him? The list is also a mirror of ordinary desire: family, wealth, land and long life. Almost all of us would say yes to such a deal. That is why Nachiketa’s answer, in the next verse, is so striking."]];
E["katha-18"]=[["Explanation","Nachiketa answers with a calm, clear view of what Yama offers. These things last only until tomorrow, and they wear out the vigour of the senses. Even a whole life is short. So keep your horses and chariots, your dance and song.|He does not despise the world. He just sees that pleasures fade and that even a very long life ends. A thing that ends cannot answer the question of what lies beyond ending. A young boy sees what most adults have trouble admitting: the best offers of the world cannot solve the deepest need."]];
E["katha-19"]=[["Explanation","Yama now answers Nachiketa properly. The goal that all the Vedas declare, that all kinds of discipline point to, and that people seek by living a life of restraint, is told to him in brief: it is Om.|Om stands for the one Reality in sound form. Instead of a long list of teachings, Yama gives a single sound that sums them up. Many traditions use a short word or sound for the same reason: a few syllables are easier to hold in the mind than a whole library, and they point beyond themselves."]];
E["katha-20"]=[["Explanation","This verse says more about Om. This syllable is Brahman, and this syllable is the highest. Knowing it, whatever a person wishes for is theirs.|The last line is easy to misread as a promise of success in worldly wishes. Most teachers take it differently: a person who knows the sound as the Self wants nothing that is not already given. The verse is saying that the knower is fulfilled, so that whatever he turns to feels complete. Seen this way, it fits the earlier teaching of the Isha: contentment is the real wealth."]];
E["katha-21"]=[["Explanation","The third verse in this group calls Om the best support (ālambana) and the highest support. An ālambana is something you lean on or hold. In meditation, the mind needs something to rest on, and Om is offered as the safest one.|The result is that the person who knows this support is honoured in the world of Brahman. In simple terms, one who rests the mind on the highest does not fall back into small worries. Try it as a practice: when the mind is restless, repeat Om slowly and let it be the thing you hold on to."]];
E["katha-22"]=[["Explanation","Near the end, Yama describes the highest state in a clear way. When the five senses of knowledge rest together with the mind, and the intellect also does not stir, that is called the highest state.|This is not a blank. All the instruments of experience become quiet at once. There is no running after sounds or sights, no chatter of the mind, and no restless planning. What remains is a still, wide awareness. Most of us touch it briefly, in deep calm or in absorption in something we love. The Upanishad says it can be cultivated."]];
E["katha-23"]=[["Explanation","Yama gives the state a name: yoga. They call it yoga, the steady holding of the senses. Then a person becomes apramatta, alert and not careless, because yoga both arises and fades.|The last phrase is a gentle warning. Even a good state of mind does not last on its own. It comes and goes, so one needs care and regular practice. This is why the Upanishad stresses steadiness: quiet the senses, hold them gently, stay alert, and return when you drift. Here is the earliest clear description of yoga as a discipline of the mind."]];

var IC=['\u2600','\u2766','\u2699','\u263a','\u2696','\u2740'],IB=['#fde6c8','#d7efe8','#e6dcf5','#f8d9d3','#dfe3ea','#fbe3c6'];

function chunks(t){var a=t.match(/[^.!?]+[.!?]*\s*/g)||[t],o=[],c='';a.forEach(function(x){if((c+x).length>180&&c){o.push(c);c=x}else c+=x});if(c)o.push(c);return o}
function say(q,i,id){if(id!==TS.id)return;if(i>=q.length||!TS.on){TS.on=false;TS.paused=false;var x=document.getElementById('lsb');if(x)x.textContent='\u25b6 Listen';return}var u=new SpeechSynthesisUtterance(q[i][0]);u.lang=q[i][1];u.rate=q[i][2];u.onend=function(){say(q,i+1,id)};u.onerror=function(){if(id===TS.id)TS.on=false};speechSynthesis.speak(u)}
function ls(n,j){if(!('speechSynthesis' in window)){alert('Audio is not supported on this device.');return}var b=document.getElementById('lsb');
if(TS.on&&!TS.paused){speechSynthesis.pause();TS.paused=true;b.textContent='\u25b6 Resume';return}
if(TS.on&&TS.paused){speechSynthesis.resume();TS.paused=false;b.textContent='\u23f8 Pause';return}
var d=D[j],s=S[d.id][n],e=E[d.id+'-'+(n+1)],q=[];

(e||[]).forEach(function(p){chunks(p[0]+'. '+p[1].split('|').join(' ')).forEach(function(x){q.push([x,'en-IN',.95])})});
speechSynthesis.cancel();TS.id++;TS.on=true;TS.paused=false;b.textContent='\u23f8 Pause';say(q,0,TS.id)}
function lsOld(n,j){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(S[D[j].id][n][0].replace(/[\u0964\u0965]/g,','));u.lang='hi-IN';u.rate=.8;speechSynthesis.speak(u)}
function sp(j,n){var d=D[j],s=S[d.id][n],k=d.id+'-'+(n+1),e=E[k],t=S[d.id].length;R['v:'+k]=1;save();var ic=['\ud83d\udcd6','\ud83c\udf43','\ud83d\udca1'];
var h=`<div style='${sty(d)}'><div class='sh'>${art('s'+j)}<div class='stop'><a class='cb' href='#${d.id}' aria-label='Back'>\u2190</a><div class='sr'><button class='cb' aria-label='Save verse' data-k='v:${k}' onclick='return sv(this.dataset.k,event)'>${B['v:'+k]?BKON:BK}</button><button class='cb' aria-label='Copy verse' onclick='cp(${n},${j})'>\u22ee</button></div></div><h1>${d.nm} Upanishad</h1><div class='chips2'><span class='pill'>${d.nm}</span><span class='pill'>Sloka ${n+1} of ${t}</span></div></div>`;
h+=`<div class='mc'><div class='mh'><span class='no'>${n+1}</span><b>Sanskrit Sloka</b><button class='ls' id='lsb' onclick='ls(${n},${j})'>${TS.on?(TS.paused?'\u25b6 Resume':'\u23f8 Pause'):'\u25b6 Listen'}</button></div><div class='bigs'>${s[0].replace(' \u0964 ',' \u0964<br>')}</div><div class='dvd'><i></i>\u2740<i></i></div><div class='trb'><div><small>Transliteration</small><div class='tl'>${s[1].replace(' | ',' |<br>')}</div></div><button class='cpb' onclick='cp(${n},${j})' aria-label='Copy'>\u2398</button></div><div class='mn2'><div class='ci2'>\ud83d\udcd6</div><div><b>Meaning</b><p>${s[2]}</p></div></div></div>`;
(e||[['Full explanation','The detailed explanation for this verse is still being written. The meaning above and the overview on the '+d.nm+' page cover its core idea for now.']]).forEach(function(p,i){var chk=/Living|Try|How to/i.test(p[0]);h+=`<div class='sc t${i%3}'><div class='sch'><div class='ci2 c${i%3}'>${ic[i%3]}</div><h2>${p[0]}</h2></div>`;if(chk){p[1].split('|').join(' ').split(/(?<=[.!?])\s+/).slice(0,5).forEach(function(x){h+=`<div class='ck'><i>\u2713</i><span>${x}</span></div>`})}else{p[1].split('|').forEach(function(x){h+=`<p>${x}</p>`})}h+='</div>'});
h+=`<div class='sbar'><a class='sb prev' href='${n>0?'#'+d.id+'-'+n:'#'+d.id}'>\u2039 Previous Sloka</a><a class='sb mid' href='#${d.id}'>\u25a6<small>All Slokas</small></a><a class='sb nxt' href='${n<t-1?'#'+d.id+'-'+(n+2):'#'+d.id}'>${n<t-1?'Next Sloka \u203a':'Back to '+d.nm}</a></div></div>`;app.innerHTML=h}

if(e){e.forEach(function(p){h+='<div class="sec"><h2>'+p[0]+'</h2><p>'+p[1].split('|').join('</p><p>')+'</p></div>'})}else{h+='<div class="sec"><h2>Full explanation</h2><p>The detailed explanation for this verse is still being written. The meaning above and the overview on the '+d.nm+' page cover its core idea for now.</p></div>'}

var k=location.hash.slice(1),i=D.findIndex(function(d){return d.id===k});
var m=k.match(/^([a-z]+)-(\d+)$/);if(m){var j=D.findIndex(function(d){return d.id===m[1]});if(j>=0&&S[m[1]][m[2]-1]){sp(j,+m[2]-1);window.scrollTo(0,0);return}}if(k==='reading'||k==='saved')lst(k);else if(i<0)home();else page(i);
