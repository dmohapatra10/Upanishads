:root{--bg:#f4f2fa;--card:#fff;--ink:#1c1938;--mute:#5d5a7a;--line:#e3e0f0;--gold:#c9831a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110f28;--card:#1b1838;--ink:#f0eefb;--mute:#a9a6c9;--line:#2c2850;--gold:#f0b44d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110f28;--card:#1b1838;--ink:#f0eefb;--mute:#a9a6c9;--line:#2c2850;--gold:#f0b44d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,rgba(201,131,26,.18),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(109,63,196,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:17px/1.65 Figtree,system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 60px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font:600 15px Figtree;color:var(--mute);text-decoration:none}
button{font:inherit;cursor:pointer}
.theme{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:26px 0 30px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.om{position:absolute;inset:0;display:grid;place-items:center;font:700 62px 'Noto Serif Devanagari',serif;color:var(--gold)}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:700}
.hero p{margin:10px 0 0;color:var(--mute);max-width:46ch}
.prog{margin-top:12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px var(--c)}
.cap{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:22px 20px 18px;position:relative}
.cap .dv{font:700 30px 'Noto Serif Devanagari',serif;line-height:1.3}
.cap .nm{font:600 14px Figtree;opacity:.9}
.done{position:absolute;top:14px;right:14px;background:#fff;color:#1c1938;border-radius:99px;font-size:12px;font-weight:600;padding:2px 10px}
.body{padding:16px 20px 20px}
.q{font:600 19px/1.3 Fraunces,serif;margin-bottom:10px}
.meta{color:var(--mute);font-size:14px}
.back{background:none;border:0;color:var(--mute);padding:8px 0;font-weight:600}
.head{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-radius:26px;padding:30px 24px;margin:8px 0 22px}
.head .dv{font:700 34px 'Noto Serif Devanagari',serif;opacity:.95}
.head h1{font-size:clamp(32px,7vw,48px);margin:2px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 13px;font-size:14px;font-weight:500}
.big{font:600 clamp(21px,4.5vw,27px)/1.3 Fraunces,serif;margin:0 0 6px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.sec h2{font-size:23px;margin-bottom:12px}
.sec p{margin:0 0 10px;max-width:68ch}
.pt{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt i{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:8px}
.pt b{display:block;font:600 18px Fraunces,serif}
.pt span{color:var(--mute)}
.quote{border-left:5px solid var(--c);padding:4px 0 4px 16px;margin:12px 0;font:italic 400 19px/1.5 Fraunces,serif}
.rem{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border:0}
.rem h2{color:#fff}
.try{border:2px dashed var(--c)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:99px;padding:12px 22px;font-weight:600;background:var(--c);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.on{background:#2e8b57}
.sl{padding:14px 0;border-top:1px solid var(--line)}.sl:first-of-type{border-top:0}.sl .sk{font:500 22px/1.9 'Noto Serif Devanagari',serif;color:var(--c)}.sl .tr{font-style:italic;color:var(--mute);font-size:15px;line-height:1.55;margin:2px 0 6px}.sl .mn{margin:0}.sl .rf{font-size:13px;color:var(--mute);font-weight:600}
.rd{display:inline-block;margin-top:8px;font-weight:600;color:var(--c);text-decoration:none}.vk{font:500 clamp(22px,5vw,30px)/1.9 'Noto Serif Devanagari',serif;margin-top:16px}.tr2{font-style:italic;color:var(--mute);margin-bottom:10px}.cap{overflow:hidden}.cap::after{content:"";position:absolute;right:-30px;bottom:-44px;width:130px;height:130px;border-radius:50%;border:18px solid rgba(255,255,255,.15)}.sec p+p{margin-top:12px}.ring{filter:drop-shadow(0 0 22px rgba(201,131,26,.35))}.head{box-shadow:0 20px 40px -24px var(--c)}
.foot{margin-top:34px;color:var(--mute);font-size:14px;text-align:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.ring{width:130px;height:130px}.om{font-size:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--paper:#f7efe0;--cardc:#fdf8ee;--navy:#161a3b;--rust:#b4501c;--mut:#6b6470;--gold:#e0a23a;--ln:#eadcc4;--sh:rgba(90,50,10,.3);color-scheme:light}

<script>
var D=[
{id:"isha",dv:"ईशोपनिषद्",nm:"Isha",c:"#d98a12",c2:"#c2410c",veda:"Yajur Veda",v:18,m:6,
q:"How can I live in the world and still stay free?",
line:"Everything is filled with the divine. Enjoy life, but don’t grab.",
set:"The shortest Upanishad. It is a calm talk about living an active life without getting trapped by wanting more.",
pts:[["See the divine in everything","The whole world, moving or still, is pervaded by one Reality. So nothing is truly separate from you."],["Enjoy by letting go","Use what you have with gratitude. Don’t covet what belongs to others. Contentment is the real wealth."],["Keep working, stay free","You are meant to act through your life. Work done without clinging does not bind you."],["See yourself in all","One who sees every being in their own Self, and their Self in every being, has no hatred left."],["Hold both knowledge and action","Only knowledge makes you a dreamer. Only worldly effort makes you restless. Together they carry you past fear and into peace."]],
vs:"Whoever sees all beings in the Self, and the Self in all beings, feels no hatred.",
rem:"Hold the world lightly. Do your duty fully, enjoy fully, and don’t cling.",
tr:"Today, enjoy one thing (a meal, a view) without wishing for more of it."},
{id:"kena",dv:"केनोपनिषद्",nm:"Kena",c:"#0e8f8a",c2:"#1d4ed8",veda:"Sama Veda",v:35,m:8,
q:"Who is behind my mind, my eyes and my words?",
line:"The power that makes you think and see cannot itself be seen as an object.",
set:"“Kena” means “by whom?”. A student asks who really makes the mind think, the eyes see and the breath move.",
pts:[["The knower behind the senses","It is the ear of the ear, the mind of the mind, the speech of speech. Find that source and you find the Self."],["Not what we worship as a thing","What you can point to, name or describe is not the ultimate. It is what makes pointing and naming possible."],["True knowing is humble","Whoever thinks they have fully understood hasn’t. Whoever admits they can’t grasp it entirely is closer."],["The story of the gods and the grass","The gods win a battle and grow proud. A mysterious being appears. Fire cannot burn a blade of grass in front of it. Wind cannot blow it away. The gods learn that their power was borrowed."],["Realisation brings life’s meaning","Knowing this Source in this very life is what makes life worth living."]],
vs:"It is the ear of the ear, the mind of the mind, the speech of speech.",
rem:"Your talents are borrowed light. Stay grateful and humble.",
tr:"Next time you feel proud of your skill, pause and ask: where did this ability come from?"},
{id:"katha",dv:"कठोपनिषद्",nm:"Katha",c:"#6d3fc4",c2:"#be185d",veda:"Yajur Veda",v:120,m:20,
q:"What happens after death, and what is truly worth seeking?",
line:"A boy meets Death and asks for the deepest answer.",
set:"A young boy, Nachiketa, is sent to Yama, the lord of death, by his angry father. Yama is away for three days, so he offers three wishes to make up for it.",
pts:[["The three wishes","First, peace for his father. Second, knowledge of a sacred fire ritual. Third, the secret of what lies beyond death."],["Yama tests him","Yama offers wealth, long life and pleasures instead. Nachiketa calmly says that all of this wears out. He wants the truth."],["Good versus pleasant","There are two paths: the good (shreyas) and the pleasant (preyas). The wise choose the good, and the foolish chase what feels nice now."],["The Self never dies","It is not born and does not die. It is unchanged when the body falls, like a person changing clothes."],["The chariot","You are the rider, the body is the chariot, the intellect is the driver, the mind is the reins and the senses are the horses. A trained mind steers you home."],["Wake up","Arise, awake, and learn from the wise. The path is sharp like a razor’s edge, but it can be walked."]],
vs:"The Self is not born, nor does it die. It is ancient and does not perish when the body does.",
rem:"Choose what is good for you over what is merely pleasant.",
tr:"Make one choice today that your future self will thank you for, even if it’s harder now."},
{id:"mandukya",dv:"माण्डूक्योपनिषद्",nm:"Mandukya",c:"#2563eb",c2:"#7c3aed",veda:"Atharva Veda",v:12,m:5,
q:"What is Om, and who am I beyond waking, dreaming and sleeping?",
line:"The shortest teaching with the deepest map of consciousness.",
set:"Just 12 verses. It says Om is everything, and then uses Om’s sounds to explain the states of your own mind.",
pts:[["Om is all","Past, present and future are Om. Whatever lies beyond time is also Om."],["Waking (the sound A)","You are aware of the outer world through the senses."],["Dreaming (the sound U)","You are aware of inner worlds made by the mind."],["Deep sleep (the sound M)","There are no objects or dreams. Only a quiet, undifferentiated rest."],["The Fourth (the silence)","This is Turiya, the awareness behind all three states. It is peaceful, whole and not an object. This is your real Self."]],
vs:"This Self is the Fourth. It is peaceful and without a second.",
rem:"States come and go. The awareness that watches them does not.",
tr:"Chant Om slowly three times. Notice the quiet that remains after the sound ends."},
{id:"mundaka",dv:"मुण्डकोपनिषद्",nm:"Mundaka",c:"#b91c1c",c2:"#ea580c",veda:"Atharva Veda",v:64,m:12,
q:"What one thing, once known, makes everything known?",
line:"Rituals and learning are not enough. Seek the one source.",
set:"A householder asks the teacher Angiras this big question. The teacher answers with images that are easy to remember.",
pts:[["Two kinds of knowledge","Lower knowledge covers texts, skills and rituals. Higher knowledge is realising the unchanging Source."],["Rituals are leaky boats","Only ritual won’t carry you across life’s ocean. It needs inner understanding."],["The two birds","Two birds sit on one tree. One eats the fruit, sweet and bitter. The other simply watches. You are the watcher."],["The bow and the arrow","Om is the bow, the mind is the arrow, and Brahman is the target. Aim with a steady, focused mind."],["Rivers into the sea","Rivers lose their names when they merge into the sea. In the same way, a knower dissolves into the Whole."],["Truth alone wins","“Satyam eva jayate” comes from here. In the end, truth prevails, not falsehood."]],
vs:"Truth alone triumphs, not falsehood.",
rem:"Don’t only collect information. Look for the one understanding that changes how you see.",
tr:"Spend five minutes just watching your thoughts, like the second bird."},
{id:"prashna",dv:"प्रश्नोपनिषद्",nm:"Prashna",c:"#15803d",c2:"#0891b2",veda:"Atharva Veda",v:67,m:14,
q:"Six honest questions about life, breath and the Self.",
line:"Six seekers, one wise teacher, and clear answers.",
set:"“Prashna” means question. Six seekers wait a year with discipline, then ask the sage Pippalada their questions one by one.",
pts:[["Where do beings come from?","Creation pairs two forces: the life-energy (prana) and matter that gives it form."],["What keeps us alive?","The senses and mind argue about who is most important. Prana, the vital breath, shows it is the support of all."],["How is prana born?","It comes from the Self, like a shadow from a person, and enters the body through the mind."],["What happens in sleep and dreams?","The mind rests in the Self during deep sleep, and dreams are played out by the mind."],["What does meditating on Om give?","Where your meditation aims, you rise to. Om meditation leads to the highest."],["Who is the person of sixteen parts?","All the parts of a person, such as breath, senses and mind, arise from the Self and dissolve back into it, like rivers into the sea."]],
vs:"Like rivers flowing into the sea, all parts merge back into the Self.",
rem:"Good questions, asked with patience, open the door to wisdom.",
tr:"Write down one big question about life. Don’t answer it. Just keep it with you this week."}
];
var S={
isha:[["ईशा वास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् । तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥","īśā vāsyam idaṃ sarvaṃ yat kiñca jagatyāṃ jagat | tena tyaktena bhuñjīthā mā gṛdhaḥ kasya svid dhanam ||","Everything in this changing world is covered by the Lord. Enjoy through letting go, and do not covet anyone’s wealth.","Isha 1"],["यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति । सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥","yas tu sarvāṇi bhūtāny ātmany evānupaśyati | sarvabhūteṣu cātmānaṃ tato na vijugupsate ||","One who sees all beings in the Self, and the Self in all beings, feels no hatred.","Isha 6"],["ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥","oṃ pūrṇam adaḥ pūrṇam idaṃ pūrṇāt pūrṇam udacyate | pūrṇasya pūrṇam ādāya pūrṇam evāvaśiṣyate ||","That is whole, this is whole. From the whole comes the whole. Take the whole from the whole, and the whole remains.","Peace chant"]],
kena:[["केनेषितं पतति प्रेषितं मनः केन प्राणः प्रथमः प्रैति युक्तः । केनेषितां वाचमिमां वदन्ति चक्षुः श्रोत्रं क उ देवो युनक्ति ॥","keneṣitaṃ patati preṣitaṃ manaḥ kena prāṇaḥ prathamaḥ praiti yuktaḥ | keneṣitāṃ vācam imāṃ vadanti cakṣuḥ śrotraṃ ka u devo yunakti ||","By whom is the mind sent out to think? Who first drives the breath? Who makes us speak, and which power joins the eye and ear to their work?","Kena 1.1"],["श्रोत्रस्य श्रोत्रं मनसो मनो यद् वाचो ह वाचं स उ प्राणस्य प्राणः । चक्षुषश्चक्षुरतिमुच्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति ॥","śrotrasya śrotraṃ manaso mano yad vāco ha vācaṃ sa u prāṇasya prāṇaḥ | cakṣuṣaś cakṣur atimucya dhīrāḥ pretyāsmāl lokād amṛtā bhavanti ||","It is the ear of the ear, the mind of the mind, the speech of speech, the breath of the breath, and the eye of the eye. The wise see this and become free.","Kena 1.2"]],
katha:[["श्रेयश्च प्रेयश्च मनुष्यमेतस्तौ सम्परीत्य विविनक्ति धीरः । श्रेयो हि धीरोऽभि प्रेयसो वृणीते प्रेयो मन्दो योगक्षेमाद् वृणीते ॥","śreyaś ca preyaś ca manuṣyam etas tau samparītya vivinakti dhīraḥ | śreyo hi dhīro ’bhi preyaso vṛṇīte preyo mando yogakṣemād vṛṇīte ||","The good and the pleasant come to every person. The wise look at both and choose the good. The shortsighted choose the pleasant for comfort’s sake.","Katha 1.2.2"],["न जायते म्रियते वा विपश्चिन्नायं कुतश्चिन्न बभूव कश्चित् । अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे ॥","na jāyate mriyate vā vipaścin nāyaṃ kutaścin na babhūva kaścit | ajo nityaḥ śāśvato ’yaṃ purāṇo na hanyate hanyamāne śarīre ||","The wise Self is never born and never dies. It is unborn, constant, eternal and ancient. It is not killed when the body is killed.","Katha 1.2.18"],["आत्मानं रथिनं विद्धि शरीरं रथमेव तु । बुद्धिं तु सारथिं विद्धि मनः प्रग्रहमेव च ॥","ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu | buddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca ||","Know the Self as the rider, the body as the chariot, the intellect as the driver, and the mind as the reins.","Katha 1.3.3"],["उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत । क्षुरस्य धारा निशिता दुरत्यया दुर्गं पथस्तत् कवयो वदन्ति ॥","uttiṣṭhata jāgrata prāpya varān nibodhata | kṣurasya dhārā niśitā duratyayā durgaṃ pathas tat kavayo vadanti ||","Arise, awake, and learn from the best teachers. The wise say the path is as hard to walk as the edge of a razor.","Katha 1.3.14"]],
mandukya:[["ॐ इत्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं भूतं भवद्भविष्यदिति सर्वमोङ्कार एव । यच्चान्यत् त्रिकालातीतं तदप्योङ्कार एव ॥","oṃ ity etad akṣaram idaṃ sarvaṃ tasyopavyākhyānaṃ bhūtaṃ bhavad bhaviṣyad iti sarvam oṅkāra eva | yac cānyat trikālātītaṃ tad apy oṅkāra eva ||","Om is all this. Past, present and future are all just Om. Whatever lies beyond the three times is also Om.","Mandukya 1"],["सर्वं ह्येतद् ब्रह्मायमात्मा ब्रह्म सोऽयमात्मा चतुष्पात् ॥","sarvaṃ hy etad brahmāyam ātmā brahma so ’yam ātmā catuṣpāt ||","All this is Brahman. This Self is Brahman, and this Self has four parts.","Mandukya 2"],["प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः ॥","prapañcopaśamaṃ śāntaṃ śivam advaitaṃ caturthaṃ manyante sa ātmā sa vijñeyaḥ ||","The end of all appearance, peaceful, auspicious, without a second: this is the Fourth. This is the Self, and this is to be known.","Mandukya 7 (closing part)"]],
mundaka:[["द्वा सुपर्णा सयुजा सखाया समानं वृक्षं परिषस्वजाते । तयोरन्यः पिप्पलं स्वाद्वत्त्यनश्नन्नन्यो अभिचाकशीति ॥","dvā suparṇā sayujā sakhāyā samānaṃ vṛkṣaṃ pariṣasvajāte | tayor anyaḥ pippalaṃ svādv atty anaśnann anyo abhicākaśīti ||","Two birds, close companions, sit on the same tree. One eats the sweet fruit. The other does not eat, and simply watches.","Mundaka 3.1.1"],["प्रणवो धनुः शरो ह्यात्मा ब्रह्म तल्लक्ष्यमुच्यते । अप्रमत्तेन वेद्धव्यं शरवत्तन्मयो भवेत् ॥","praṇavo dhanuḥ śaro hy ātmā brahma tal lakṣyam ucyate | apramattena veddhavyaṃ śaravat tanmayo bhavet ||","Om is the bow, the Self is the arrow, and Brahman is called the target. Hit it with a steady mind, and become one with it like an arrow in its target.","Mundaka 2.2.4"],["सत्यमेव जयते नानृतं सत्येन पन्था विततो देवयानः ॥","satyam eva jayate nānṛtaṃ satyena panthā vitato devayānaḥ ||","Truth alone wins, not falsehood. By truth the path to the divine is laid out.","Mundaka 3.1.6"],["यथा नद्यः स्यन्दमानाः समुद्रेऽस्तं गच्छन्ति नामरूपे विहाय । तथा विद्वान्नामरूपाद्विमुक्तः परात्परं पुरुषमुपैति दिव्यम् ॥","yathā nadyaḥ syandamānāḥ samudre ’staṃ gacchanti nāmarūpe vihāya | tathā vidvān nāmarūpād vimuktaḥ parāt paraṃ puruṣam upaiti divyam ||","As flowing rivers merge into the sea and lose name and form, so the knower, freed from name and form, reaches the highest divine Being.","Mundaka 3.2.8"]],
prashna:[["यथेमा नद्यः स्यन्दमानाः समुद्रायणाः समुद्रं प्राप्यास्तं गच्छन्ति भिद्येते तासां नामरूपे समुद्र इत्येवं प्रोच्यते ।","yathemā nadyaḥ syandamānāḥ samudrāyaṇāḥ samudraṃ prāpyāstaṃ gacchanti bhidyete tāsāṃ nāmarūpe samudra ity evaṃ procyate |","As these flowing rivers go to the sea and vanish into it, losing their names and forms, and are simply called the sea, so it is for all the parts of a person.","Prashna 6.5"],["भद्रं कर्णेभिः शृणुयाम देवाः भद्रं पश्येमाक्षभिर्यजत्राः ।","bhadraṃ karṇebhiḥ śṛṇuyāma devāḥ bhadraṃ paśyemākṣabhir yajatrāḥ |","May we hear only what is good with our ears, and see only what is good with our eyes.","Peace chant"]]};
S.isha=[
["ईशा वास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् । तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥","īśā vāsyam idaṃ sarvaṃ yat kiñca jagatyāṃ jagat | tena tyaktena bhuñjīthā mā gṛdhaḥ kasya svid dhanam ||","Everything in this changing world is covered by the Lord. Enjoy through letting go, and do not covet anyone’s wealth.","Isha 1"],
["कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः । एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥","kurvann eveha karmāṇi jijīviṣec chataṃ samāḥ | evaṃ tvayi nānyatheto ’sti na karma lipyate nare ||","Keep doing your work here and wish to live a hundred years. For a person there is no other way, and work does not stick to you.","Isha 2"],
["असुर्या नाम ते लोका अन्धेन तमसावृताः । ताँस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥","asuryā nāma te lokā andhena tamasāvṛtāḥ | tāṃs te pretyābhigacchanti ye ke cātmahano janāḥ ||","Those worlds are called sunless, wrapped in blind darkness. People who ignore or kill the Self go there after death.","Isha 3"],
["अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् । तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥","anejad ekaṃ manaso javīyo nainad devā āpnuvan pūrvam arṣat | tad dhāvato ’nyān atyeti tiṣṭhat tasminn apo mātariśvā dadhāti ||","The One does not move, yet it is swifter than the mind. The senses cannot catch it, for it is always ahead. Standing still, it outruns all who run, and in it the life-force supports all activity.","Isha 4"],
["तदेजति तन्नैजति तद्दूरे तद्वन्तिके । तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥","tad ejati tan naijati tad dūre tad vantike | tad antarasya sarvasya tad u sarvasyāsya bāhyataḥ ||","It moves and it does not move. It is far and it is near. It is inside all this, and it is outside all this.","Isha 5"],
["यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति । सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥","yas tu sarvāṇi bhūtāny ātmany evānupaśyati | sarvabhūteṣu cātmānaṃ tato na vijugupsate ||","One who sees all beings in the Self, and the Self in all beings, feels no hatred.","Isha 6"],
["यस्मिन्सर्वाणि भूतान्यात्मैवाभूद्विजानतः । तत्र को मोहः कः शोक एकत्वमनुपश्यतः ॥","yasmin sarvāṇi bhūtāny ātmaivābhūd vijānataḥ | tatra ko mohaḥ kaḥ śoka ekatvam anupaśyataḥ ||","For one who knows, all beings have become the Self. What confusion or sorrow can there be for one who sees oneness?","Isha 7"],
["स पर्यगाच्छुक्रमकायमव्रणमस्नाविरं शुद्धमपापविद्धम् । कविर्मनीषी परिभूः स्वयम्भूर्याथातथ्यतोऽर्थान्व्यदधाच्छाश्वतीभ्यः समाभ्यः ॥","sa paryagāc chukram akāyam avraṇam asnāviraṃ śuddham apāpaviddham | kavir manīṣī paribhūḥ svayambhūr yāthātathyato ’rthān vyadadhāc chāśvatībhyaḥ samābhyaḥ ||","That Self is radiant, bodiless, without wound, pure and untouched by evil. It is the wise seer, above all, self-existent, who arranged everything rightly through endless years.","Isha 8"],
["अन्धं तमः प्रविशन्ति येऽविद्यामुपासते । ततो भूय इव ते तमो य उ विद्यायां रताः ॥","andhaṃ tamaḥ praviśanti ye ’vidyām upāsate | tato bhūya iva te tamo ya u vidyāyāṃ ratāḥ ||","Those devoted only to worldly action enter blind darkness. Those who delight only in knowledge enter what seems an even deeper darkness.","Isha 9"],
["अन्यदेवाहुर्विद्ययान्यदाहुरविद्यया । इति शुश्रुम धीराणां ये नस्तद्विचचक्षिरे ॥","anyad evāhur vidyayānyad āhur avidyayā | iti śuśruma dhīrāṇāṃ ye nas tad vicacakṣire ||","One result, they say, comes from knowledge, and another from action. So we have heard from the wise who explained this to us.","Isha 10"],
["विद्यां चाविद्यां च यस्तद्वेदोभयं सह । अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥","vidyāṃ cāvidyāṃ ca yas tad vedobhayaṃ saha | avidyayā mṛtyuṃ tīrtvā vidyayāmṛtam aśnute ||","One who knows knowledge and action together crosses over death through action and gains immortality through knowledge.","Isha 11"],
["अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते । ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥","andhaṃ tamaḥ praviśanti ye ’sambhūtim upāsate | tato bhūya iva te tamo ya u sambhūtyāṃ ratāḥ ||","Those who worship only the unmanifest source enter blind darkness. Those devoted only to the manifest world enter an even deeper darkness.","Isha 12"],
["अन्यदेवाहुः सम्भवादन्यदाहुरसम्भवात् । इति शुश्रुम धीराणां ये नस्तद्विचचक्षिरे ॥","anyad evāhuḥ sambhavād anyad āhur asambhavāt | iti śuśruma dhīrāṇāṃ ye nas tad vicacakṣire ||","One result, they say, comes from the manifest, and another from the unmanifest. So we have heard from the wise who explained this to us.","Isha 13"],
["सम्भूतिं च विनाशं च यस्तद्वेदोभयं सह । विनाशेन मृत्युं तीर्त्वा सम्भूत्यामृतमश्नुते ॥","sambhūtiṃ ca vināśaṃ ca yas tad vedobhayaṃ saha | vināśena mṛtyuṃ tīrtvā sambhūtyāmṛtam aśnute ||","One who knows the manifest and the perishable together crosses over death through the perishable and gains immortality through the manifest.","Isha 14"],
["हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् । तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥","hiraṇmayena pātreṇa satyasyāpihitaṃ mukham | tat tvaṃ pūṣann apāvṛṇu satyadharmāya dṛṣṭaye ||","The face of truth is covered by a golden disc. O Sun, uncover it so that I, who love truth, may see it.","Isha 15"],
["पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन्समूह । तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥","pūṣann ekarṣe yama sūrya prājāpatya vyūha raśmīn samūha | tejo yat te rūpaṃ kalyāṇatamaṃ tat te paśyāmi yo ’sāv asau puruṣaḥ so ’ham asmi ||","O Sun, sole seer and guide, gather your rays. I see your most radiant form. The Being who is there, I am that.","Isha 16"],
["वायुरनिलममृतमथेदं भस्मान्तं शरीरम् । ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥","vāyur anilam amṛtam athedaṃ bhasmāntaṃ śarīram | oṃ krato smara kṛtaṃ smara krato smara kṛtaṃ smara ||","Let my breath merge into the immortal air, and let this body end in ashes. Om, O mind, remember what I have done. Remember, remember.","Isha 17"],
["अग्ने नय सुपथा राये अस्मान्विश्वानि देव वयुनानि विद्वान् । युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥","agne naya supathā rāye asmān viśvāni deva vayunāni vidvān | yuyodhy asmaj juhurāṇam eno bhūyiṣṭhāṃ te nama uktiṃ vidhema ||","O Fire, you know all our deeds. Lead us by the good path to fulfilment, and remove the wrong that makes us stray. We offer you many words of praise.","Isha 18"],
["ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥","oṃ pūrṇam adaḥ pūrṇam idaṃ pūrṇāt pūrṇam udacyate | pūrṇasya pūrṇam ādāya pūrṇam evāvaśiṣyate ||","That is whole, this is whole. From the whole comes the whole. Take the whole from the whole, and the whole remains.","Peace chant"]];
S.mandukya=[
["ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं भूतं भवद्भविष्यदिति सर्वमोङ्कार एव । यच्चान्यत्त्रिकालातीतं तदप्योङ्कार एव ॥","oṃ ity etad akṣaram idaṃ sarvaṃ tasyopavyākhyānaṃ bhūtaṃ bhavad bhaviṣyad iti sarvam oṅkāra eva | yac cānyat trikālātītaṃ tad apy oṅkāra eva ||","Om is all this. Past, present and future are all just Om. Whatever lies beyond the three times is also Om.","Mandukya 1"],
["सर्वं ह्येतद् ब्रह्मायमात्मा ब्रह्म सोऽयमात्मा चतुष्पात् ॥","sarvaṃ hy etad brahmāyam ātmā brahma so ’yam ātmā catuṣpāt ||","All this is Brahman. This Self is Brahman, and this Self has four parts.","Mandukya 2"],
["जागरितस्थानो बहिष्प्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः ॥","jāgarita-sthāno bahiṣprajñaḥ saptāṅga ekonaviṃśati-mukhaḥ sthūla-bhug vaiśvānaraḥ prathamaḥ pādaḥ ||","The first part is the waking state. Awareness faces outward, it has seven limbs and nineteen mouths, and it enjoys gross objects. It is called Vaishvanara.","Mandukya 3"],
["स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः ॥","svapna-sthāno ’ntaḥprajñaḥ saptāṅga ekonaviṃśati-mukhaḥ pravivikta-bhuk taijaso dvitīyaḥ pādaḥ ||","The second part is the dream state. Awareness faces inward, with the same limbs and mouths, and it enjoys subtle inner impressions. It is called Taijasa.","Mandukya 4"],
["यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्सुषुप्तम् । सुषुप्तस्थान एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक् चेतोमुखः प्राज्ञस्तृतीयः पादः ॥","yatra supto na kañcana kāmaṃ kāmayate na kañcana svapnaṃ paśyati tat suṣuptam | suṣupta-sthāna ekībhūtaḥ prajñānaghana evānandamayo hy ānandabhuk ceto-mukhaḥ prājñas tṛtīyaḥ pādaḥ ||","Deep sleep is where a sleeper wants nothing and sees no dream. In it the mind is gathered into one, full of bliss, and it enjoys bliss. It is called Prajna, the third part.","Mandukya 5"],
["एष सर्वेश्वर एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम् ॥","eṣa sarveśvara eṣa sarvajña eṣo ’ntaryāmy eṣa yoniḥ sarvasya prabhavāpyayau hi bhūtānām ||","This is the Lord of all, the knower of all, the inner guide and the source of everything. It is where beings arise and where they dissolve.","Mandukya 6"],
["नान्तःप्रज्ञं न बहिष्प्रज्ञं नोभयतःप्रज्ञं न प्रज्ञानघनं न प्रज्ञं नाप्रज्ञम् । अदृष्टमव्यवहार्यमग्राह्यमलक्षणमचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसारं प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः ॥","nāntaḥprajñaṃ na bahiṣprajñaṃ nobhayataḥprajñaṃ na prajñānaghanaṃ na prajñaṃ nāprajñam | adṛṣṭam avyavahāryam agrāhyam alakṣaṇam acintyam avyapadeśyam ekātmapratyayasāraṃ prapañcopaśamaṃ śāntaṃ śivam advaitaṃ caturthaṃ manyante sa ātmā sa vijñeyaḥ ||","Not inward-aware, not outward-aware, not both, not a mass of awareness, not aware, not unaware. Unseen, beyond dealings, ungraspable, without marks, unthinkable, indescribable, the essence of the one Self, the end of all appearance, peaceful, auspicious, without a second: this is the Fourth. This is the Self, and this is to be known.","Mandukya 7"],
["सोऽयमात्माध्यक्षरमोङ्कारोऽधिमात्रं पादा मात्रा मात्राश्च पादा अकार उकारो मकार इति ॥","so ’yam ātmādhyakṣaram oṅkāro ’dhimātraṃ pādā mātrā mātrāś ca pādā akāra ukāro makāra iti ||","This same Self, seen as sound, is Om. Its parts are the three sounds A, U and M, and the four parts of the Self match them.","Mandukya 8"],
["जागरितस्थानो वैश्वानरोऽकारः प्रथमा मात्राप्तेरादिमत्त्वाद्वाप्नोति ह वै सर्वान् कामानादिश्च भवति य एवं वेद ॥","jāgarita-sthāno vaiśvānaro ’kāraḥ prathamā mātrāpter ādimattvād vāpnoti ha vai sarvān kāmān ādiś ca bhavati ya evaṃ veda ||","Waking, Vaishvanara, is the sound A, the first part, because it pervades all and comes first. One who knows this gains all desires and becomes first.","Mandukya 9"],
["स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षात् उभयत्वाद्वोत्कर्षति ह वै ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले भवति य एवं वेद ॥","svapna-sthānas taijasa ukāro dvitīyā mātrotkarṣāt ubhayatvād votkarṣati ha vai jñāna-santatiṃ samānaś ca bhavati nāsyābrahmavit kule bhavati ya evaṃ veda ||","Dreaming, Taijasa, is the sound U, the second part, because it rises between the other two. One who knows this grows in knowledge and is treated as an equal by all.","Mandukya 10"],
["सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं वेद ॥","suṣupta-sthānaḥ prājño makāras tṛtīyā mātrā miter apīter vā minoti ha vā idaṃ sarvam apītiś ca bhavati ya evaṃ veda ||","Deep sleep, Prajna, is the sound M, the third part, because it measures and dissolves. One who knows this measures the whole world and becomes one with its source.","Mandukya 11"],
["अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत एवमोङ्कार आत्मैव संविशत्यात्मनाऽऽत्मानं य एवं वेद य एवं वेद ॥","amātraś caturtho ’vyavahāryaḥ prapañcopaśamaḥ śivo ’dvaita evam oṅkāra ātmaiva saṃviśaty ātmanātmānaṃ ya evaṃ veda ya evaṃ veda ||","Without a part is the Fourth: beyond dealings, the end of appearance, auspicious and without a second. This is Om, the Self itself. One who knows this enters the Self by the Self.","Mandukya 12"]];
S.kena=[
["केनेषितं पतति प्रेषितं मनः केन प्राणः प्रथमः प्रैति युक्तः । केनेषितां वाचमिमां वदन्ति चक्षुः श्रोत्रं क उ देवो युनक्ति ॥","keneṣitaṃ patati preṣitaṃ manaḥ kena prāṇaḥ prathamaḥ praiti yuktaḥ | keneṣitāṃ vācam imāṃ vadanti cakṣuḥ śrotraṃ ka u devo yunakti ||","By whom is the mind sent out to think? Who first drives the breath? Who makes us speak, and which power joins the eye and ear to their work?","Kena 1.1"],
["श्रोत्रस्य श्रोत्रं मनसो मनो यद् वाचो ह वाचं स उ प्राणस्य प्राणः । चक्षुषश्चक्षुरतिमुच्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति ॥","śrotrasya śrotraṃ manaso mano yad vāco ha vācaṃ sa u prāṇasya prāṇaḥ | cakṣuṣaś cakṣur atimucya dhīrāḥ pretyāsmāl lokād amṛtā bhavanti ||","It is the ear of the ear, the mind of the mind, the speech of speech, the breath of the breath, and the eye of the eye. The wise see this and become free.","Kena 1.2"],
["न तत्र चक्षुर्गच्छति न वाग्गच्छति नो मनो न विद्मो न विजानीमो यथैतदनुशिष्यादन्यदेव तद्विदितादथो अविदितादधि । इति शुश्रुम पूर्वेषां ये नस्तद्व्याचचक्षिरे ॥","na tatra cakṣur gacchati na vāg gacchati no mano na vidmo na vijānīmo yathaitad anuśiṣyād anyad eva tad viditād atho aviditād adhi | iti śuśruma pūrveṣāṃ ye nas tad vyācacakṣire ||","The eye does not go there, nor speech, nor mind. We do not know it, and we do not see how one could teach it. It is other than the known and above the unknown. So we have heard from the ancient teachers.","Kena 1.3–1.4"],
["यद्वाचानभ्युदितं येन वागभ्युद्यते । तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते ॥","yad vācānabhyuditaṃ yena vāg abhyudyate | tad eva brahma tvaṃ viddhi nedam yad idam upāsate ||","That which speech cannot express, but by which speech is expressed: know that alone as Brahman, and not this which people worship here.","Kena 1.5"],
["यन्मनसा न मनुते येनाहुर्मनो मतम् । तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते ॥","yan manasā na manute yenāhur mano matam | tad eva brahma tvaṃ viddhi nedam yad idam upāsate ||","That which the mind cannot think, but by which the mind is thought: know that alone as Brahman, and not this which people worship here.","Kena 1.6"],
["यच्चक्षुषा न पश्यति येन चक्षूंषि पश्यति । तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते ॥","yac cakṣuṣā na paśyati yena cakṣūṃṣi paśyati | tad eva brahma tvaṃ viddhi nedam yad idam upāsate ||","That which the eye cannot see, but by which the eyes see: know that alone as Brahman, and not this which people worship here.","Kena 1.7"],
["यच्छ्रोत्रेण न शृणोति येन श्रोत्रमिदं श्रुतम् । तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते ॥","yac chrotreṇa na śṛṇoti yena śrotram idaṃ śrutam | tad eva brahma tvaṃ viddhi nedam yad idam upāsate ||","That which the ear cannot hear, but by which the ear hears: know that alone as Brahman, and not this which people worship here.","Kena 1.8"],
["यत्प्राणेन न प्राणिति येन प्राणः प्रणीयते । तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते ॥","yat prāṇena na prāṇiti yena prāṇaḥ praṇīyate | tad eva brahma tvaṃ viddhi nedam yad idam upāsate ||","That which the breath cannot breathe, but by which the breath is led: know that alone as Brahman, and not this which people worship here.","Kena 1.9"],
["नाहं मन्ये सुवेदेति नो न वेदेति वेद च । यो नस्तद्वेद तद्वेद नो न वेदेति वेद च ॥","nāhaṃ manye suvedeti no na vedeti veda ca | yo nas tad veda tad veda no na vedeti veda ca ||","I do not think I know it well, and yet I do not think I do not know it. One of us who understands this saying understands it: I do not know, and yet I know.","Kena 2.2"],
["यस्यामतं तस्य मतं मतं यस्य न वेद सः । अविज्ञातं विजानतां विज्ञातमविजानताम् ॥","yasyāmatam tasya matam matam yasya na veda saḥ | avijñātaṃ vijānatāṃ vijñātam avijānatām ||","For whoever thinks it is beyond understanding, it is understood. Whoever thinks it is understood does not know it. It is unknown to those who claim to know, and known to those who do not claim to know.","Kena 2.3"]];
S.kena.push(
["ब्रह्म ह देवेभ्यो विजिग्ये तस्य ह ब्रह्मणो विजये देवा अमहीयन्त । त ऐक्षन्तास्माकमेवायं विजयोऽस्माकमेवायं महिमेति ॥","brahma ha devebhyo vijigye tasya ha brahmaṇo vijaye devā amahīyanta | ta aikṣantāsmākam evāyaṃ vijayo ’smākam evāyaṃ mahimeti ||","Brahman won a victory for the gods, and the gods took pride in that victory. They thought, “This victory is ours alone, and this glory is ours alone.”","Kena 3.1"],
["तद्धैषां विजज्ञौ तेभ्यो ह प्रादुर्बभूव तन्न व्यजानत किमिदं यक्षमिति ॥","tad dhaiṣāṃ vijajñau tebhyo ha prādurbabhūva tan na vyajānata kim idaṃ yakṣam iti ||","Brahman knew their pride and appeared before them. They could not recognise it, and asked, “What is this wonderful being?”","Kena 3.2"],
["तस्मै तृणं निदधावेतद्दहेति तदुपप्रेयाय सर्वजवेन तन्न शशाक दग्धुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति ॥","tasmai tṛṇaṃ nidadhāv etad daheti tad upapreyāya sarvajavena tan na śaśāka dagdhuṃ sa tata eva nivavṛte naitad aśakam vijñātuṃ yad etad yakṣam iti ||","The being placed a blade of grass before Agni, the fire god, and said, “Burn this.” Agni rushed at it with all his speed but could not burn it. He turned back and said, “I could not find out what this being is.”","Kena 3.6"],
["तस्मै तृणं निदधावेतदादत्स्वेति तदुपप्रेयाय सर्वजवेन तन्न शशाकादातुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति ॥","tasmai tṛṇaṃ nidadhāv etad ādatsveti tad upapreyāya sarvajavena tan na śaśākādātuṃ sa tata eva nivavṛte naitad aśakam vijñātuṃ yad etad yakṣam iti ||","The being placed the same blade of grass before Vayu, the wind god, and said, “Take this.” Vayu rushed at it with all his speed but could not lift it. He too turned back, unable to learn what the being is.","Kena 3.10"],
["अथेन्द्रमब्रुवन्मघवन्नेतद्विजानीहि किमेतद्यक्षमिति तथेति तदभ्यद्रवत्तस्मात्तिरोदधे ॥","atha indram abruvan maghavann etad vijānīhi kim etad yakṣam iti tatheti tad abhyadravat tasmāt tirodadhe ||","Then they said to Indra, the king of gods, “Maghavan, find out what this being is.” Indra agreed and went towards it, but the being vanished from before him.","Kena 3.11"],
["स तस्मिन्नेवाकाशे स्त्रियमाजगाम बहुशोभमानामुमां हैमवतीं तां होवाच किमेतद्यक्षमिति ॥","sa tasminn evākāśe striyam ājagāma bahu śobhamānām umāṃ haimavatīṃ tāṃ hovāca kim etad yakṣam iti ||","In that same space, Indra met a radiant woman, Uma, the daughter of the Himalaya. He asked her, “What is this being?”","Kena 3.12"],
["सा ब्रह्मेति होवाच ब्रह्मणो वा एतद्विजये महीयध्वमिति ततो हैव विदाञ्चकार ब्रह्मेति ॥","sā brahmeti hovāca brahmaṇo vā etad vijaye mahīyadhvam iti tato haiva vidāñcakāra brahmeti ||","She said, “This is Brahman. You are glorifying yourselves over Brahman’s victory.” Then Indra understood that it was Brahman.","Kena 4.1"],
["तस्यै तपो दमः कर्मेति प्रतिष्ठा वेदाः सर्वाङ्गानि सत्यमायतनम् ॥","tasyai tapo damaḥ karmeti pratiṣṭhā vedāḥ sarvāṅgāni satyam āyatanam ||","Its foundation is discipline, self-control and right action. The Vedas and their limbs are its parts, and truth is its home.","Kena 4.8"]);
S.katha=[
["उशन् ह वै वाजश्रवसः सर्ववेदसं ददौ । तस्य ह नचिकेता नाम पुत्र आस ॥","uśan ha vai vājaśravasaḥ sarvavedasaṃ dadau | tasya ha naciketā nāma putra āsa ||","Vajashravasa, wishing for a reward, gave away all he owned in a sacrifice. He had a son named Nachiketa.","Katha 1.1.1"],
["स होवाच पितरं तात कस्मै मां दास्यसीति । द्वितीयं तृतीयं तं होवाच मृत्यवे त्वा ददामीति ॥","sa hovāca pitaraṃ tāta kasmai māṃ dāsyasīti | dvitīyaṃ tṛtīyaṃ taṃ hovāca mṛtyave tvā dadāmīti ||","Nachiketa asked his father, “Father, to whom will you give me?” He asked a second and a third time. The father, angry, said, “I give you to Death.”","Katha 1.1.4"],
["येयं प्रेते विचिकित्सा मनुष्येऽस्तीत्येके नायमस्तीति चैके । एतद्विद्यामनुशिष्टस्त्वयाहं वराणामेष वरस्तृतीयः ॥","yeyaṃ prete vicikitsā manuṣye ’stīty eke nāyam astīti caike | etad vidyām anuśiṣṭas tvayāhaṃ varāṇām eṣa varas tṛtīyaḥ ||","When a person has died, some say “he still exists” and others say “he does not”. Let me learn the truth from you. This is the third of my wishes.","Katha 1.1.20"],
["अन्यच्छ्रेयोऽन्यदुतैव प्रेयस्ते उभे नानार्थे पुरुषं सिनीतः । तयोः श्रेय आददानस्य साधु भवति हीयतेऽर्थाद्य उ प्रेयो वृणीते ॥","anyac chreyo ’nyad utaiva preyas te ubhe nānārthe puruṣaṃ sinītaḥ | tayoḥ śreya ādadānasya sādhu bhavati hīyate ’rthād ya u preyo vṛṇīte ||","The good is one thing and the pleasant another. Both bind a person, with different aims. It goes well for one who picks the good. One who picks the pleasant loses the real aim.","Katha 1.2.1"],
["श्रेयश्च प्रेयश्च मनुष्यमेतस्तौ सम्परीत्य विविनक्ति धीरः । श्रेयो हि धीरोऽभि प्रेयसो वृणीते प्रेयो मन्दो योगक्षेमाद् वृणीते ॥","śreyaś ca preyaś ca manuṣyam etas tau samparītya vivinakti dhīraḥ | śreyo hi dhīro ’bhi preyaso vṛṇīte preyo mando yogakṣemād vṛṇīte ||","The good and the pleasant come to every person. The wise look at both and choose the good. The shortsighted choose the pleasant for comfort’s sake.","Katha 1.2.2"],
["न जायते म्रियते वा विपश्चिन्नायं कुतश्चिन्न बभूव कश्चित् । अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे ॥","na jāyate mriyate vā vipaścin nāyaṃ kutaścin na babhūva kaścit | ajo nityaḥ śāśvato ’yaṃ purāṇo na hanyate hanyamāne śarīre ||","The wise Self is never born and never dies. It is unborn, constant, eternal and ancient. It is not killed when the body is killed.","Katha 1.2.18"],
["नायमात्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन । यमेवैष वृणुते तेन लभ्यस्तस्यैष आत्मा विवृणुते तनूं स्वाम् ॥","nāyam ātmā pravacanena labhyo na medhayā na bahunā śrutena | yam evaiṣa vṛṇute tena labhyas tasyaiṣa ātmā vivṛṇute tanūṃ svām ||","The Self is not gained by lectures, by cleverness or by much learning. It is gained by the one whom it chooses, and to that person it reveals its own form.","Katha 1.2.23"],
["आत्मानं रथिनं विद्धि शरीरं रथमेव तु । बुद्धिं तु सारथिं विद्धि मनः प्रग्रहमेव च ॥","ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu | buddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca ||","Know the Self as the rider, the body as the chariot, the intellect as the driver, and the mind as the reins.","Katha 1.3.3"],
["उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत । क्षुरस्य धारा निशिता दुरत्यया दुर्गं पथस्तत् कवयो वदन्ति ॥","uttiṣṭhata jāgrata prāpya varān nibodhata | kṣurasya dhārā niśitā duratyayā durgaṃ pathas tat kavayo vadanti ||","Arise, awake, and learn from the best teachers. The wise say the path is as hard to walk as the edge of a razor.","Katha 1.3.14"],
["पराञ्चि खानि व्यतृणत्स्वयम्भूस्तस्मात्पराङ्पश्यति नान्तरात्मन् । कश्चिद्धीरः प्रत्यगात्मानमैक्षदावृत्तचक्षुरमृतत्वमिच्छन् ॥","parāñci khāni vyatṛṇat svayambhūs tasmāt parāṅ paśyati nāntarātman | kaścid dhīraḥ pratyagātmānam aikṣad āvṛttacakṣur amṛtatvam icchan ||","The Creator made the senses face outward, so we look out and not within. Rarely, a wise person who wants immortality turns the eyes inward and sees the Self.","Katha 2.1.1"],
["यदा सर्वे प्रमुच्यन्ते कामा वेऽस्य हृदि श्रिताः । अथ मर्त्योऽमृतो भवत्यत्र ब्रह्म समश्नुते ॥","yadā sarve pramucyante kāmā ye ’sya hṛdi śritāḥ | atha martyo ’mṛto bhavaty atra brahma samaśnute ||","When every desire lodged in the heart is let go, the mortal becomes immortal and reaches Brahman right here.","Katha 2.3.14"]];
S.mundaka.push(
["शौनको ह वै महाशालोऽङ्गिरसं विधिवदुपसन्नः पप्रच्छ । कस्मिन्नु भगवो विज्ञाते सर्वमिदं विज्ञातं भवतीति ॥","śaunako ha vai mahāśālo ’ṅgirasaṃ vidhivad upasannaḥ papraccha | kasminnu bhagavo vijñāte sarvam idaṃ vijñātaṃ bhavatīti ||","Shaunaka, a great householder, approached Angiras in the proper way and asked, “Venerable sir, what is that by knowing which all this becomes known?”","Mundaka 1.1.3"],
["द्वे विद्ये वेदितव्ये इति ह स्म यद्ब्रह्मविदो वदन्ति परा चैवापरा च ॥","dve vidye veditavye iti ha sma yad brahmavido vadanti parā caivāparā ca ||","Two kinds of knowledge are to be known, say the knowers of Brahman: the higher and the lower.","Mundaka 1.1.4"],
["प्लवा ह्येते अदृढा यज्ञरूपा अष्टादशोक्तमवरं येषु कर्म । एतच्छ्रेयो येऽभिनन्दन्ति मूढा जरामृत्युं ते पुनरेवापि यन्ति ॥","plavā hy ete adṛḍā yajñarūpā aṣṭādaśokatam avaraṃ yeṣu karma | etac chreyo ye ’bhinandanti mūḍhā jarāmṛtyuṃ te punar evāpi yanti ||","These ritual forms are unsteady boats, and the lower action in them is flimsy. Fools who celebrate them as the highest good fall again into old age and death.","Mundaka 1.2.7"],
["परीक्ष्य लोकान्कर्मचितान्ब्राह्मणो निर्वेदमायान्नास्त्यकृतः कृतेन । तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत्समित्पाणिः श्रोत्रियं ब्रह्मनिष्ठम् ॥","parīkṣya lokān karmacitān brāhmaṇo nirvedam āyān nāsty akṛtaḥ kṛtena | tad vijñānārthaṃ sa gurum evābhigacchet samitpāṇiḥ śrotriyaṃ brahmaniṣṭham ||","Having examined the worlds won by action, a seeker becomes dispassionate, seeing that what is not made cannot be gained by what is made. To know it, he should go with fuel in hand to a teacher who knows the scriptures and is steady in Brahman.","Mundaka 1.2.12"],
["यदा पश्यः पश्यते रुक्मवर्णं कर्तारमीशं पुरुषं ब्रह्मयोनिम् । तदा विद्वान् पुण्यपापे विधूय निरञ्जनः परमं साम्यमुपैति ॥","yadā paśyah paśyate rukmavarṇaṃ kartāram īśaṃ puruṣaṃ brahmayonim | tadā vidvān puṇyapāpe vidhūya nirañjanaḥ paramaṃ sāmyam upaiti ||","When the seer sees the golden-hued Lord, the maker, the Being, the source of Brahma, the knower shakes off good and evil, becomes stainless and reaches the highest equality.","Mundaka 3.1.3"],
["स यो ह वै तत्परमं ब्रह्म वेद ब्रह्मैव भवति नास्याब्रह्मवित्कुले भवति । तरति शोकं तरति पाप्मानं गुहाग्रन्थिभ्यो विमुक्तोऽमृतो भवति ॥","sa yo ha vai tat paramaṃ brahma veda brahmaiva bhavati nāsyābrahmavit kule bhavati | tarati śokaṃ tarati pāpmānaṃ guhāgranthibhyo vimukto ’mṛto bhavati ||","One who knows that supreme Brahman becomes Brahman. In that family, no one is ignorant of Brahman. The knower crosses sorrow and sin, is freed from the knots of the heart, and becomes immortal.","Mundaka 3.2.9"]);
S.prashna.push(
["तान् ह स ऋषिरुवाच भूय एव तपसा ब्रह्मचर्येण श्रद्धया संवत्सरं संवत्स्यथ यथाकामं प्रश्नान् पृच्छत यदि विज्ञास्यामः सर्वं ह वो वक्ष्याम इति ॥","tān ha sa ṛṣir uvāca bhūya eva tapasā brahmacaryeṇa śraddhayā saṃvatsaraṃ saṃvatsyatha yathākāmaṃ praśnān pṛcchata yadi vijñāsyāmaḥ sarvaṃ ha vo vakṣyāma iti ||","The sage told them, “Live with me one more year with discipline, restraint and faith. Then ask whatever you wish. If I know, I will tell you everything.”","Prashna 1.2"],
["अथ कबन्धी कात्यायन उपेत्य पप्रच्छ भगवन् कुतो ह वा इमाः प्रजाः प्रजायन्ते इति ॥","atha kabandhī kātyāyana upetya papraccha bhagavan kuto ha vā imāḥ prajāḥ prajāyanta iti ||","Then Kabandhi Katyayana came forward and asked, “Venerable sir, where do all these creatures come from?”","Prashna 1.3"],
["प्राणस्येदं वशे सर्वं त्रिदिवे यत्प्रतिष्ठितम् । मातेव पुत्रान् रक्षस्व श्रीश्च प्रज्ञां च विधेहि न इति ॥","prāṇasyedam vaśe sarvaṃ tridive yat pratiṣṭhitam | māteva putrān rakṣasva śrīś ca prajñāṃ ca vidhehi na iti ||","All this, whatever stands in the heavens, is under the control of Prana. Protect us as a mother protects her children, and grant us fortune and wisdom.","Prashna 2.13"]);
S.kena.push(
["यदि मन्यसे सुवेदेति दभ्रमेवापि नूनं त्वं वेत्थ ब्रह्मणो रूपम् । यदस्य त्वं यदस्य देवेष्वथ नु मीमांस्यमेव ते मन्ये विदितम् ॥","yadi manyase suvedeti dabhram evāpi nūnaṃ tvaṃ vettha brahmaṇo rūpam | yad asya tvaṃ yad asya deveṣv atha nu mīmāṃsyam eva te manye viditam ||","If you think “I know it well”, you know only a little of Brahman’s form, whether in yourself or in the gods. So it still needs to be examined by you.","Kena 2.1"],
["प्रतिबोधविदितं मतममृतत्वं हि विन्दते । आत्मना विन्दते वीर्यं विद्यया विन्दतेऽमृतम् ॥","pratibodhaviditam matam amṛtatvaṃ hi vindate | ātmanā vindate vīryaṃ vidyayā vindate ’mṛtam ||","It is truly known when it is known in every act of knowing, and through that one gains immortality. By the Self one gains strength, and by knowledge one gains immortality.","Kena 2.4"],
["इह चेदवेदीदथ सत्यमस्ति न चेदिहावेदीन्महती विनष्टिः । भूतेषु भूतेषु विचित्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति ॥","iha ced avedīd atha satyam asti na ced ihāvedīn mahatī vinaṣṭiḥ | bhūteṣu bhūteṣu vicitya dhīrāḥ pretyāsmāl lokād amṛtā bhavanti ||","If one knows it here, that is truth. If one does not, the loss is great. The wise, seeing it in every being, leave this world and become immortal.","Kena 2.5"],
["यो वा एतामेवं वेदापहत्य पाप्मानमनन्ते स्वर्गे लोके ज्येये प्रतितिष्ठति प्रतितिष्ठति ॥","yo vā etām evaṃ vedāpahatya pāpmānam anante svarge loke jyeye pratitiṣṭhati pratitiṣṭhati ||","One who knows this thus casts off evil and is established in the infinite, highest world. Yes, established.","Kena 4.9"]);
S.katha.push(
["तिस्रो रात्रीर्यदवात्सीर्गृहे मेऽनश्नन्ब्रह्मन्नतिथिर्नमस्यः । नमस्तेऽस्तु ब्रह्मन् स्वस्ति मेऽस्तु तस्मात्प्रति त्रीन्वरान्वृणीष्व ॥","tisro rātrīr yad avātsīr gṛhe me ’naśnan brahman atithir namasyaḥ | namas te astu brahman svasti me ’stu tasmāt prati trīn varān vṛṇīṣva ||","O Brahmin, you stayed three nights in my house without food, a guest worthy of honour. Salutations to you. Let all be well with me. Choose three wishes, one for each night.","Katha 1.1.9"],
["न वित्तेन तर्पणीयो मनुष्यो लप्स्यामहे वित्तमद्राक्ष्म चेत्त्वा । जीविष्यामो यावदीशिष्यसि त्वं वरस्तु मे वरणीयः स एव ॥","na vittena tarpaṇīyo manuṣyo lapsyāmahe vittam adrākṣma cet tvā | jīviṣyāmo yāvad īśiṣyasi tvaṃ varas tu me varaṇīyaḥ sa eva ||","A person cannot be satisfied with wealth. We will get wealth anyway now that we have seen you, and we will live as long as you rule. But the wish I choose is only that one.","Katha 1.1.27"],
["अणोरणीयान्महतो महीयानात्मास्य जन्तोर्निहितो गुहायाम् । तमक्रतुः पश्यति वीतशोको धातुप्रसादान्महिमानमात्मनः ॥","aṇor aṇīyān mahato mahīyān ātmāsya jantor nihito guhāyām | tam akratuḥ paśyati vītaśoko dhātuprasādān mahimānam ātmanaḥ ||","Smaller than the small, greater than the great, the Self rests in the heart of every creature. One free of craving, with calm senses, sees its greatness and is free of sorrow.","Katha 1.2.20"],
["इन्द्रियाणि हयानाहुर्विषयांस्तेषु गोचरान् । आत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्मनीषिणः ॥","indriyāṇi hayān āhur viṣayāṃs teṣu gocarān | ātmendriyamanoyuktaṃ bhoktyāhur manīṣiṇaḥ ||","The wise call the senses the horses, and the objects of the senses their paths. The Self joined with body, senses and mind is the enjoyer, they say.","Katha 1.3.4"],
["एष सर्वेषु भूतेषु गूढोऽत्मा न प्रकाशते । दृश्यते त्वग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः ॥","eṣa sarveṣu bhūteṣu gūḍo ’tmā na prakāśate | dṛśyate tv agryayā buddhyā sūkṣmayā sūkṣmadarśibhiḥ ||","This Self is hidden in all beings and does not shine out. It is seen by sharp, subtle minds, by those who look closely.","Katha 1.3.12"]);
S.kena.push(
["तेऽग्निमब्रुवञ्जातवेद एतद्विजानीहि किमेतद्यक्षमिति तथेति ॥","te 'gnim abruvañ jātaveda etad vijānīhi kim etad yakṣam iti tatheti ||","They said to Agni, “Jataveda, find out what this being is.” Agni said, “So be it.”","Kena 3.3"],
["तदभ्यद्रवत्तमभ्यवदत्कोऽसीत्यग्निर्वा अहमस्मीत्यब्रवीज्जातवेदा वा अहमस्मीति ॥","tad abhyadravat tam abhyavadat ko 'sīty agnir vā aham asmīty abravīj jātavedā vā aham asmīti ||","Agni ran towards it. The being asked, “Who are you?” He replied, “I am Agni, I am Jataveda.”","Kena 3.4"],
["तस्मिँस्त्वयि किं वीर्यमित्यपीदँ सर्वं दहेयं यदिदं पृथिव्यामिति ॥","tasmiṃs tvayi kiṃ vīryam ity apīdaṃ sarvaṃ daheyaṃ yad idaṃ pṛthivyām iti ||","“What power do you have?” the being asked. Agni said, “I could burn everything on earth.”","Kena 3.5"],
["अथ वायुमब्रुवन्वायवेतद्विजानीहि किमेतद्यक्षमिति तथेति ॥","atha vāyum abruvan vāyav etad vijānīhi kim etad yakṣam iti tatheti ||","Then they said to Vayu, “Vayu, find out what this being is.” Vayu said, “So be it.”","Kena 3.7"],
["तदभ्यद्रवत्तमभ्यवदत्कोऽसीति वायुर्वा अहमस्मीत्यब्रवीन्मातरिश्वा वा अहमस्मीति ॥","tad abhyadravat tam abhyavadat ko 'sīti vāyur vā aham asmīty abravīn mātariśvā vā aham asmīti ||","Vayu ran towards it. The being asked, “Who are you?” He replied, “I am Vayu, I am Matarishva.”","Kena 3.8"],
["तस्मिँस्त्वयि किं वीर्यमित्यपीदँ सर्वमाददीय यदिदं पृथिव्यामिति ॥","tasmiṃs tvayi kiṃ vīryam ity apīdaṃ sarvam ādadīya yad idaṃ pṛthivyām iti ||","“What power do you have?” the being asked. Vayu said, “I could carry off everything on earth.”","Kena 3.9"]);
S.kena.push(
["तस्माद्वा एते देवा अतितरामिवान्यान्देवान्यदग्निर्वायुरिन्द्रस्ते ह्येनन्नेदिष्ठं पस्पर्शुस्ते ह्येनत्प्रथमो विदाङ्चकार ब्रह्मेति ॥","tasmād vā ete devā atitarām ivānyān devān yad agnir vāyur indras te hy enan nediṣṭhaṃ pasparśuḥ te hy enat prathamo vidāṃcāra brahmeti ||","Therefore Agni, Vayu and Indra surpass the other gods, because they came closest to Brahman and were the first to know it was Brahman.","Kena 4.2"],
["तस्माद्वा इन्द्रोऽतितरामिवान्यान्देवान्स ह्येनन्नेदिष्ठं पस्पर्श स ह्येनत्प्रथमो विदाङ्चकार ब्रह्मेति ॥","tasmād vā indro 'titarām ivānyān devān sa hy enan nediṣṭhaṃ pasparśa sa hy enat prathamo vidāṃcāra brahmeti ||","Therefore Indra surpasses the other gods, because he came closest to Brahman and was the first to know it was Brahman.","Kena 4.3"],
["तस्यैष आदेशो यदेतद्विद्युतो व्यद्युतदा इतीन्न्यमीमिषदा इत्यधिदैवतम् ॥","tasyaiṣa ādeśo yad etad vidyuto vyadyutad ā itīn nyamīmiṣad ā ity adhidaivatam ||","This is its teaching about the divine: it is like a flash of lightning, like the blink of an eye.","Kena 4.4"],
["अथाध्यात्मं यदेतद्गच्छतीव च मनोऽनेन चैतदुपस्मरत्यभीक्ष्णं सङ्कल्पः ॥","athādhyātmaṃ yad etad gacchatīva ca mano 'nena caitad upasmaraty abhīkṣṇaṃ saṅkalpaḥ ||","Now about the self: the mind seems to go towards it, and through the mind one remembers it again and again with firm resolve.","Kena 4.5"],
["तद्ध तद्वनं नाम तद्वनमित्युपासितव्यं स य एतदेवं वेदाभि हैनं सर्वाणि भूतानि संवाञ्छन्ति ॥","taddha tadvanaṃ nāma tadvanam ity upāsitavyaṃ sa ya etad evaṃ vedābhi hainam sarvāṇi bhūtāni saṃvāñchanti ||","It is called Tadvana, the one all beings long for, and it should be meditated on in this way. One who knows it thus is loved by all beings.","Kena 4.6"],
["उपनिषदं भो ब्रूहीत्युक्ता त उपनिषद्ब्राह्मीं वाव त उपनिषदमब्रूमेति ॥","upaniṣadaṃ bho brūhīty uktvā ta upaniṣad brāhmīṃ vāva ta upaniṣadam abrūmeti ||","“Sir, tell me the Upanishad.” “The Upanishad has been told to you. We have told you the Upanishad about Brahman.”","Kena 4.7"]);
S.katha.push(
["शतायुषः पुत्रपौत्रान्वृणीष्व बहून्पशून्हस्तिहिरण्यमश्वान् । भूमेर्महदायतनं वृणीष्व स्वयं च जीव शरदो यावदिच्छसि ॥","śatāyuṣaḥ putrapautrān vṛṇīṣva bahūn paśūn hastihiraṇyam aśvān | bhūmer mahad āyatanaṃ vṛṇīṣva svayaṃ ca jīva śarado yāvad icchasi ||","Choose sons and grandsons who live a hundred years, many cattle, elephants, gold and horses, a vast stretch of land, and live yourself as many years as you wish.","Katha 1.1.23"],
["श्वोभावा मर्त्यस्य यदन्तकैतत्सर्वेन्द्रियाणां जरयन्ति तेजः । अपि सर्वं जीवितमल्पमेव तवैव वाहास्तव नृत्यगीते ॥","śvobhāvā martyasya yad antakaitat sarvendriyāṇāṃ jarayanti tejaḥ | api sarvaṃ jīvitam alpam eva tavaiva vāhās tava nṛtyagīte ||","These things last only until tomorrow, O Ender, and they wear out the vigour of all the senses. Even a whole life is short. Keep your horses and chariots, your dance and song.","Katha 1.1.26"],
["सर्वे वेदा यत्पदमामनन्ति तपांसि सर्वाणि च यद्वदन्ति । यदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं सङ्ग्रहेण ब्रवीम्योमित्येतत् ॥","sarve vedā yat padam āmananti tapāṃsi sarvāṇi ca yad vadanti | yad icchanto brahmacaryaṃ caranti tat te padam saṅgraheṇa bravīmy om ity etat ||","The goal that all the Vedas declare, that all austerities speak of, and that people seek by living a disciplined life: I tell you in brief, it is Om.","Katha 1.2.15"],
["एतद्ध्येवाक्षरं ब्रह्म एतद्ध्येवाक्षरं परम् । एतद्ध्येवाक्षरं ज्ञात्वा यो यदिच्छति तस्य तत् ॥","etad dhy evākṣaraṃ brahma etad dhy evākṣaraṃ param | etad dhy evākṣaraṃ jñātvā yo yad icchati tasya tat ||","This syllable is Brahman, this syllable is the highest. Knowing this syllable, whatever one wishes for is his.","Katha 1.2.16"],
["एतदालम्बनं श्रेष्ठमेतदालम्बनं परम् । एतदालम्बनं ज्ञात्वा ब्रह्मलोके महीयते ॥","etad ālambanaṃ śreṣṭham etad ālambanaṃ param | etad ālambanaṃ jñātvā brahmaloke mahīyate ||","This is the best support, this is the highest support. Knowing this support, one is honoured in the world of Brahman.","Katha 1.2.17"],
["यदा पंचावतिष्ठन्ते ज्ञानानि मनसा सह । बुद्धिश्च न विचेष्टति तामाहुर्परमां गतिम् ॥","yadā pañcāvatiṣṭhante jñānāni manasā saha | buddhiś ca na viceṣṭati tām āhuḥ paramāṃ gatim ||","When the five senses rest together with the mind, and the intellect does not stir, they say that is the highest state.","Katha 2.3.10"],
["तां योगमिति मन्यन्ते स्थिरामिन्द्रियधारणाम् । अप्रमत्तस्तदा भवति योगो हि प्रभवाप्ययौ ॥","tāṃ yogam iti manyante sthirām indriyadhāraṇām | apramattas tadā bhavati yogo hi prabhavāpyayau ||","They call this yoga, the steady holding of the senses. Then a person becomes alert and undistracted, for yoga both arises and fades.","Katha 2.3.11"]);
var G={
isha:"The Isha opens by saying the world belongs to the divine, not to you. That one idea changes how you hold things: as a caretaker, not an owner. It then refuses to pick between a life of action and a life of wisdom. It asks for both, without clinging to either.",
kena:"Kena never defines the ultimate Reality. It points to the knower, who can never become an object of knowledge. Like an eye that cannot see itself, the Self is known by being it, not by studying it. That is why the text keeps saying “not this”.",
katha:"Katha is the most story-like Upanishad. Yama first tests the boy, offering pleasures to see if he will swerve. Only when Nachiketa stays steady does Yama teach him. The lesson: the deepest answer is useful only to a student who is ready for it.",
mandukya:"Because it is so short, Mandukya is studied line by line. Each of the three states has an experiencer, but the Fourth is not another state. It is the unchanging witness present in all three. This is why it is called the heart of Advaita Vedanta, the teaching of non-duality.",
mundaka:"Mundaka asks what to know so that everything is known, and answers in images: two birds, a bow, rivers. It values action and study but calls them the lower step. The higher step is direct realisation, which comes through a teacher and steady practice.",
prashna:"Each question builds on the last, moving from outer creation to the body, then the mind, then the Self. By the end the Self is shown as the single source of everything the earlier questions asked about. It is a complete course in six small steps."};
